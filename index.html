<style>

    --bg: #131722; --panel: #1e222d; --border: #2a2e39; --text: #d1d4dc;

  /* jasny motyw - wlaczany przyciskiem, zapamietywany miedzy wizytami */
  body.jasny {
    --bg: #ffffff; --panel: #f4f6f9; --border: #d6dae2; --text: #1b2028;
    --muted: #6b7280; --green: #0f9d84; --red: #d84b47; --accent: #1d5fd8;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; height: 100vh; overflow: hidden; }
  #layout { display: grid; grid-template-columns: 240px 1fr 300px; grid-template-rows: 44px 26px 1fr; height: 100vh; }
  /* zwijana lista par - wiecej miejsca na wykres i narzedzia */
  #layout.bez-listy { grid-template-columns: 0 1fr 300px; }
  #layout.bez-listy aside { display: none; }
  .only-desktop { display: inline-block; }
  header { grid-column: 1 / 4; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
  #info-bar { grid-column: 1 / 4; display: flex; align-items: center; gap: 18px; padding: 0 14px;

  header .sym { font-size: 16px; font-weight: 600; }

// Konfiguracja aplikacji (klucz anon = publiczny odczyt, RLS pilnuje reszty)

const PROG_WOLUMENU = 200000; // $ dziennego wolumenu - pary ponizej domyslnie ukryte na liscie


// Wskazniki wlasne (faza 2 startuje tutaj): baza wolumenu, Ichimoku, Fibo.

function rollMedianShift1(vals, window = 30, minPeriods = 20) {
  const out = new Array(vals.length).fill(NaN);
  for (let i = 0; i < vals.length; i++) {
    const w = vals.slice(Math.max(0, i - window), i).filter(Number.isFinite);
    if (w.length >= minPeriods) {
      w.sort((a, b) => a - b);
      const m = w.length >> 1;
      out[i] = w.length % 2 ? w[m] : (w[m - 1] + w[m]) / 2;
    }
  }
  return out;
}

const hh = (rows, i, n) => Math.max(...rows.slice(Math.max(0, i - n + 1), i + 1).map((r) => r.high));
const ll = (rows, i, n) => Math.min(...rows.slice(Math.max(0, i - n + 1), i + 1).map((r) => r.low));

function ichimoku(rows, tenkanN = 9, kijunN = 26, spanBN = 52) {
  const step = rows.length > 1 ? rows[rows.length - 1].time - rows[rows.length - 2].time : 86400;
  const tenkan = [], kijun = [], spanA = [], spanB = [], chikou = [];
  for (let i = 0; i < rows.length; i++) {
    const t = rows[i].time;
    if (i >= tenkanN - 1) tenkan.push({ time: t, value: (hh(rows, i, tenkanN) + ll(rows, i, tenkanN)) / 2 });
    if (i >= kijunN - 1) kijun.push({ time: t, value: (hh(rows, i, kijunN) + ll(rows, i, kijunN)) / 2 });
    if (i >= kijunN - 1) {
      const a = ((hh(rows, i, tenkanN) + ll(rows, i, tenkanN)) / 2 + (hh(rows, i, kijunN) + ll(rows, i, kijunN)) / 2) / 2;
      spanA.push({ time: t + kijunN * step, value: a });   // przesuniecie 26 w przod
    }
    if (i >= spanBN - 1) spanB.push({ time: t + kijunN * step, value: (hh(rows, i, spanBN) + ll(rows, i, spanBN)) / 2 });
    if (i >= kijunN) chikou.push({ time: rows[i - kijunN].time, value: rows[i].close }); // close przesuniety wstecz
  }
  return { tenkan, kijun, spanA, spanB, chikou };
}

function sma(rows, n) {
  const out = [];
  let sum = 0;
  for (let i = 0; i < rows.length; i++) {
    sum += rows[i].close;
    if (i >= n) sum -= rows[i - n].close;
    if (i >= n - 1) out.push({ time: rows[i].time, value: sum / n });
  }
  return out;
}

function ema(rows, n) {
  const out = [];
  const k = 2 / (n + 1);
  let prev = null;
  for (let i = 0; i < rows.length; i++) {
    prev = prev === null ? rows[i].close : rows[i].close * k + prev * (1 - k);
    if (i >= n - 1) out.push({ time: rows[i].time, value: prev });
  }
  return out;
}

// poziomy Fibo miedzy dwoma recznymi kotwicami (jak na TradingView)
function fiboBetween(p1, p2) {
  const hi = Math.max(p1, p2), lo = Math.min(p1, p2), span = hi - lo;
  return [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1].map((f) => ({
    label: `${(f * 100).toFixed(1)}%`, price: hi - span * f,
  }));
}

function fiboLevels(rows, lookback = 180) {
  // auto z wykrywaniem kierunku: jesli dolek byl PRZED szczytem (trend wzrostowy),
  // mierzymy zniesienia ruchu w gore (0% na szczycie); w przeciwnym razie odwrotnie
  const seg = rows.slice(-lookback);
  if (!seg.length) return [];
  let hi = -Infinity, lo = Infinity, hiI = 0, loI = 0;
  seg.forEach((r, i) => {
    if (r.high > hi) { hi = r.high; hiI = i; }
    if (r.low < lo) { lo = r.low; loI = i; }
  });
  const span = hi - lo;
  const uptrend = loI <= hiI;
  return [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1].map((f) => ({
    label: `${(f * 100).toFixed(1)}%`,
    price: uptrend ? hi - span * f : lo + span * f,
  }));
}

  if (!d || typeof d !== "object") return null;

// pasek info: wolumen 24h + baza 30d (nasze dane) + kapitalizacja (CoinGecko, cache)
const mcapCache = new Map();
async function fetchCoinInfo(symbol) {
  // wolumen 24h KROCZACY (jak ticker HTX): suma ostatnich 24 swiec godzinowych;
  // na zywo nadpisuje go subskrypcja market.detail z websocketu
  const h1 = await rest(`candles?symbol=eq.${symbol}&interval=eq.60min&select=vol&order=ts.desc&limit=24`);
  const vol24 = h1.length ? h1.reduce((a, r) => a + +r.vol, 0) : null;
  const rows = await rest(`candles?symbol=eq.${symbol}&interval=eq.1day&select=ts,vol&order=ts.desc&limit=31`);
  const hist = rows.slice(1).map((r) => +r.vol).sort((a, b) => a - b);
  const base = hist.length >= 20
    ? (hist.length % 2 ? hist[hist.length >> 1] : (hist[(hist.length >> 1) - 1] + hist[hist.length >> 1]) / 2)
    : null;
  const baseSym = symbol.replace(/usdt$/, "");
  let mcap = mcapCache.get(baseSym);
  if (mcap === undefined) {
    mcap = null;
    try {
      const s = await (await fetch(`https://api.coingecko.com/api/v3/search?query=${baseSym}`)).json();
      const coin = (s.coins || []).find((c) => String(c.symbol).toLowerCase() === baseSym);
      if (coin) {
        const m = await (await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${coin.id}`)).json();
        mcap = m?.[0]?.market_cap ?? null;
      }
    } catch (_e) { /* limit CoinGecko - trudno */ }
    mcapCache.set(baseSym, mcap);
  }
  return { vol24, base, mcap };
}

// Websocket HTX (publiczny): swiece tick-po-ticku + arkusz bid/ask.
// Ramki sa gzipowane -> pako.inflate; ping/pong utrzymuje polaczenie.
const WS_URL = "wss://api.huobi.pro/ws";

class HtxFeed {
  constructor({ onKline, onDepth, onDetail, onStatus }) {
    this.onKline = onKline; this.onDepth = onDepth;
    this.onDetail = onDetail || (() => {});
    this.onStatus = onStatus || (() => {});
    this.ws = null; this.subs = []; this.alive = false;
    this._connect();
  }

  _connect() {
    this.ws = new WebSocket(WS_URL);
    this.ws.binaryType = "arraybuffer";
    this.ws.onopen = () => { this.alive = true; this.onStatus(true); this.subs.forEach((s) => this._send({ sub: s })); };
    this.ws.onclose = () => { this.alive = false; this.onStatus(false); setTimeout(() => this._connect(), 2000); };
    this.ws.onerror = () => this.ws.close();
    this.ws.onmessage = (e) => {
      const m = JSON.parse(pako.inflate(new Uint8Array(e.data), { to: "string" }));
      if (m.ping) { this._send({ pong: m.ping }); return; }
      // odpowiedz na zadanie migawki arkusza (pelny stan 150 poziomow)
      if (m.rep && m.rep.includes(".depth.") && m.data) { this.onDepth(m.rep, m.data, true); return; }
      if (!m.ch || !m.tick) return;
      if (m.ch.includes(".kline.")) this.onKline(m.ch, m.tick);
      else if (m.ch.includes(".depth.")) this.onDepth(m.ch, m.tick, false);
      else if (m.ch.endsWith(".detail")) this.onDetail(m.ch, m.tick);
    };
  }

  _send(obj) { if (this.ws?.readyState === 1) this.ws.send(JSON.stringify(obj)); }

  // przelacza subskrypcje na nowy symbol/interwal (unsub starych)
  watch(symbol, htxPeriod) {
    for (const s of this.subs) this._send({ unsub: s });
    // Arkusz: subskrypcja oddaje tylko okolo 35 poziomow, ale ZADANIE migawki
    // (req) na tym samym kanale zwraca pelne 150 - wiec dociagamy je co 2 sekundy,
    // a subskrypcja odswieza czubek arkusza pomiedzy migawkami.
    this.symbol = symbol;
    this.subs = [`market.${symbol}.kline.${htxPeriod}`, `market.${symbol}.depth.step0`,
                 `market.${symbol}.detail`];
    if (this.alive) this.subs.forEach((s) => this._send({ sub: s }));
    clearInterval(this._migawka);
    const pobierz = () => this._send({ req: `market.${this.symbol}.depth.step0`, id: "arkusz" });
    pobierz();
    this._migawka = setInterval(pobierz, 2000);
  }
}

// Wypelniona chmura Ichimoku
class CloudPrimitive {
  constructor(chart, series, getSpans) { this._c = chart; this._s = series; this._get = getSpans; }
  updateAllViews() {}
  paneViews() {
    return [{
      renderer: () => ({
        draw: (target) => target.useMediaCoordinateSpace(({ context: ctx }) => {
          const { spanA, spanB } = this._get() || {};
          if (!spanA?.length || !spanB?.length) return;
          const byTime = new Map(spanB.map((p) => [p.time, p.value]));
          const pts = [];
          for (const p of spanA) {
            const b = byTime.get(p.time);
            if (b === undefined) continue;
            const x = this._c.timeScale().timeToCoordinate(p.time);
            const ya = this._s.priceToCoordinate(p.value);
            const yb = this._s.priceToCoordinate(b);
            if (x === null || ya === null || yb === null) continue;
            pts.push({ x, ya, yb, up: p.value >= b });
          }
          let seg = [];
          const flush = () => {
            if (seg.length < 2) { seg = []; return; }
            ctx.beginPath();
            ctx.moveTo(seg[0].x, seg[0].ya);
            for (const q of seg) ctx.lineTo(q.x, q.ya);
            for (let i = seg.length - 1; i >= 0; i--) ctx.lineTo(seg[i].x, seg[i].yb);
            ctx.closePath();
            ctx.fillStyle = seg[0].up ? "rgba(38,166,154,0.16)" : "rgba(239,83,80,0.16)";
            ctx.fill();
            seg = [];
          };
          for (const q of pts) {
            if (seg.length && seg[seg.length - 1].up !== q.up) { seg.push(q); flush(); seg = [q]; }
            else seg.push(q);
          }
          flush();
        }),
      }),
    }];
  }
}

// Kropki cenowe sygnalow: mala wypelniona kropka dokladnie na (time, price)
// z chwili sygnalu - uzupelnia marker przy swiecy (ten pokazuje tylko dzien).
class SignalDotsPrimitive {
  constructor(chart, series, getDots) { this._c = chart; this._s = series; this._get = getDots; }
  updateAllViews() {}
  paneViews() {
    return [{
      renderer: () => ({
        draw: (target) => target.useMediaCoordinateSpace(({ context: ctx }) => {
          const dots = this._get() || [];
          if (!dots.length) return;
          const ts = this._c.timeScale();
          for (const d of dots) {
            const x = ts.timeToCoordinate(d.time);
            const y = this._s.priceToCoordinate(d.price);
            if (x === null || y === null) continue;
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fillStyle = d.color;
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = "rgba(0,0,0,0.85)";  // ciemny obrys - widoczna na obu motywach
            ctx.stroke();
          }
        }),
      }),
    }];
  }
}

// Narzedzia: miarka % / Fibo 2pkt - rysowane na kanwie, podglad za kursorem
class ToolPrimitive {
  constructor(chart, series, dataRef) {
    this._c = chart; this._s = series; this._data = dataRef;
    this.mode = null;       // rysowane teraz: ruler|fibo2|trend|hline|channel|rect
    this.p1 = null; this.preview = null;
    this.pending = null;    // kanal czeka na 3. punkt (szerokosc)
    this.drawings = [];     // gotowe rysunki - zostaja na wykresie
    this._ru = null;
  }
  attached(param) { this._ru = param.requestUpdate; }
  refresh() { if (this._ru) this._ru(); }
  updateAllViews() {}

  _xy(pt) {
    if (!pt) return null;
    const x = this._c.timeScale().timeToCoordinate(pt.time);
    const y = this._s.priceToCoordinate(pt.price);
    return (x === null || y === null) ? null : { x, y };
  }

  paneViews() {
    return [{
      renderer: () => ({
        draw: (target) => target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
          this._poziomy(ctx, mediaSize);
          this._sciany(ctx, mediaSize);
          for (const f of (this.formacje ?? [])) this._formacja(ctx, f, mediaSize);
          for (const k of (this.auto ?? [])) this._kanalAuto(ctx, k);
          this.drawings.forEach((d, idx) => {
            if (idx === this.sel) { ctx.save(); ctx.shadowColor = "#fff"; ctx.shadowBlur = 10; }
            this._one(ctx, d, mediaSize);
            if (idx === this.sel) { ctx.restore(); this._uchwyty(ctx, d); }
          });
          if (this.pending) this._one(ctx, { ...this.pending, c: this.preview }, mediaSize, true);
          else if (this.mode && this.p1) {
            this._one(ctx, { type: this.mode, a: this.p1, b: this.preview }, mediaSize, true);
          }
        }),
      }),
    }];
  }

  _one(ctx, d, mediaSize, podglad = false) {
    const A = this._xy(d.a);
    if (!A) return;
    const B = d.b ? this._xy(d.b) : null;
    ctx.save();
    if (podglad) ctx.globalAlpha = 0.85;
    if (d.type === "hline") this._hline(ctx, d, A, mediaSize);
    else if (B) {
      if (d.type === "ruler") this._ruler(ctx, A.x, A.y, B.x, B.y, d.a, d.b);
      else if (d.type === "fibo2") this._fibo(ctx, A.x, B.x, d.a, d.b, mediaSize);
      else if (d.type === "trend") this._trend(ctx, A, B);
      else if (d.type === "rect") this._rect(ctx, A, B);
      else if (d.type === "channel") this._channel(ctx, d, A, B);
    }
    ctx.restore();
  }

  // WSPARCIA i OPORY: poziome linie w miejscach, gdzie cena wielokrotnie zawracala.
  // Grubosc linii rosnie z liczba dotkniec - im wiecej, tym powazniejszy poziom.
  _poziomy(ctx, mediaSize) {
    const w = mediaSize?.width ?? 9999;
    ctx.save();
    ctx.font = "10px Segoe UI";
    for (const p of (this.levels ?? [])) {
      const y = this._s.priceToCoordinate(p.price);
      if (y === null) continue;
      const kolor = p.typ === "opor" ? "239,83,80" : "38,166,154";
      ctx.strokeStyle = `rgba(${kolor},${0.35 + Math.min(0.45, p.dotkniecia * 0.09)})`;
      ctx.lineWidth = Math.min(2.4, 0.8 + p.dotkniecia * 0.25);
      ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w - 62, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = `rgb(${kolor})`;
      ctx.fillText(`${p.typ === "opor" ? "opór" : "wsparcie"} ${fp(p.price)} (${p.dotkniecia}x)`,
                   6, y - 3);
    }
    ctx.restore();
  }

  _sciany(ctx, mediaSize) {
    const w = mediaSize?.width ?? 9999;
    ctx.save();
    ctx.font = "10px Segoe UI";
    for (const s of (this.sciany ?? [])) {
      const y = this._s.priceToCoordinate(s.price);
      if (y === null) continue;
      const kolor = s.side === "kupno" ? "38,166,154" : "239,83,80";
      ctx.strokeStyle = `rgba(${kolor},0.75)`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(w * 0.72, y); ctx.lineTo(w - 64, y); ctx.stroke();
      ctx.fillStyle = `rgb(${kolor})`;
      ctx.fillText(`ściana ${s.side} ${Math.round(s.usd / 1000)} tys. $ (${s.pct.toFixed(0)}% obrotu)`,
                   w * 0.72, y - 4);
    }
    ctx.restore();
  }

  // FORMACJA podwojnego dna / szczytu: obrys "W" albo "M" + linia szyi.
  // Zamiast kropki na wykresie widac cala formacje - tak jak sie ja rysuje recznie.
  _formacja(ctx, f, mediaSize) {
    const ts = this._c.timeScale();
    const x1 = ts.timeToCoordinate(f.t1), x2 = ts.timeToCoordinate(f.t2);
    const y1 = this._s.priceToCoordinate(f.p1), y2 = this._s.priceToCoordinate(f.p2);
    const ysz = this._s.priceToCoordinate(f.szyja);
    if ([x1, x2, y1, y2, ysz].some((v) => v === null)) return;
    const dno = f.typ === "podwojne_dno";
    const kolor = f.kierunek === "ostrzezenie" ? "239,83,80" : "255,202,40";
    const xm = (x1 + x2) / 2;
    ctx.save();
    ctx.strokeStyle = `rgb(${kolor})`;
    ctx.lineWidth = 1.6;
    ctx.beginPath();                       // obrys formacji: ekstremum - szyja - ekstremum
    ctx.moveTo(x1, y1); ctx.lineTo(xm, ysz); ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.setLineDash([5, 4]);               // linia szyi przedluzona w prawo
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(x1, ysz); ctx.lineTo(mediaSize?.width ?? x2 + 200, ysz);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = "10px Segoe UI";
    ctx.fillStyle = `rgb(${kolor})`;
    ctx.fillText((dno ? "podwójne dno" : "podwójny szczyt") +
                 (f.kierunek === "ostrzezenie" ? " · pułapka" : ""),
                 x1 + 3, dno ? Math.max(y1, y2) + 12 : Math.min(y1, y2) - 5);
    ctx.restore();
  }

  // kanal wykryty przez system: pelna linia gdy uklad ma potwierdzona przewage,
  // przerywana gdy to tylko informacja
  _kanalAuto(ctx, k) {
    const ts = this._c.timeScale();
    const x1 = ts.timeToCoordinate(k.t1), x2 = ts.timeToCoordinate(k.t2);
    if (x1 === null || x2 === null) return;
    const yg1 = this._s.priceToCoordinate(k.g1), yg2 = this._s.priceToCoordinate(k.g2);
    const yd1 = this._s.priceToCoordinate(k.d1), yd2 = this._s.priceToCoordinate(k.d2);
    if ([yg1, yg2, yd1, yd2].some((v) => v === null)) return;
    ctx.save();
    const zWyzszego = k.zrodlo && this._ivBiez && k.zrodlo !== this._ivBiez;
    ctx.strokeStyle = k.alert ? "#26c6da" : zWyzszego ? "rgba(126,87,194,0.6)" : "rgba(38,198,218,0.5)";
    ctx.lineWidth = k.alert ? 1.6 : 1.2;
    if (!k.alert) ctx.setLineDash(zWyzszego ? [8, 5] : [5, 4]);
    ctx.beginPath(); ctx.moveTo(x1, yg1); ctx.lineTo(x2, yg2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1, yd1); ctx.lineTo(x2, yd2); ctx.stroke();
    ctx.setLineDash([]);
    if (k.dotkniecia) {
      ctx.font = "10px Segoe UI";
      ctx.fillStyle = "#26c6da";
      ctx.fillText(`kanał ${k.kier} · ${k.dotkniecia} dotknięć` +
                   (k.zrodlo ? ` · ${k.zrodlo}` : ""), x1 + 4, Math.min(yg1, yg2) - 5);
    }
    ctx.fillStyle = k.alert ? "rgba(38,198,218,0.10)" : "rgba(38,198,218,0.05)";
    ctx.beginPath();
    ctx.moveTo(x1, yg1); ctx.lineTo(x2, yg2); ctx.lineTo(x2, yd2); ctx.lineTo(x1, yd1);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // uchwyty zaznaczonego rysunku - za nie sie ciagnie, zeby zmienic ksztalt
  _uchwyty(ctx, d) {
    const pkt = [d.a, d.b, d.c].filter(Boolean).map((q) => this._xy(q)).filter(Boolean);
    ctx.save();
    for (const q of pkt) {
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = "#1b2028";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.rect(q.x - 4, q.y - 4, 8, 8); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  _hline(ctx, d, A, mediaSize) {
    const w = mediaSize?.width ?? 9999;
    ctx.strokeStyle = "#90a4ae"; ctx.lineWidth = 1.2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(0, A.y); ctx.lineTo(w, A.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = "11px Segoe UI"; ctx.fillStyle = "#90a4ae";
    ctx.fillText(fp(d.a.price), 6, A.y - 4);
  }
  _trend(ctx, A, B) {
    ctx.strokeStyle = "#42a5f5"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
  }
  _rect(ctx, A, B) {
    const x = Math.min(A.x, B.x), y = Math.min(A.y, B.y);
    const w = Math.abs(B.x - A.x) || 2, h = Math.abs(B.y - A.y) || 2;
    ctx.fillStyle = "rgba(66,165,245,0.12)"; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "#42a5f5"; ctx.lineWidth = 1.2; ctx.strokeRect(x, y, w, h);
  }
  _channel(ctx, d, A, B) {
    ctx.strokeStyle = "#ab47bc"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
    const C = d.c ? this._xy(d.c) : null;
    if (!C) return;
    const t = (B.x - A.x) === 0 ? 0 : (C.x - A.x) / (B.x - A.x);
    const dy = C.y - (A.y + t * (B.y - A.y));   // rownolegle przesuniecie pionowe
    ctx.beginPath(); ctx.moveTo(A.x, A.y + dy); ctx.lineTo(B.x, B.y + dy); ctx.stroke();
    ctx.fillStyle = "rgba(171,71,188,0.10)";
    ctx.beginPath();
    ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y);
    ctx.lineTo(B.x, B.y + dy); ctx.lineTo(A.x, A.y + dy);
    ctx.closePath(); ctx.fill();
  }
  _ruler(ctx, x1, y1, x2, y2, a, b) {
    const up = b.price >= a.price;
    const col = up ? "38,166,154" : "239,83,80";
    ctx.fillStyle = `rgba(${col},0.13)`;
    ctx.fillRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1) || 2, Math.abs(y2 - y1) || 2);
    ctx.strokeStyle = `rgb(${col})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const chg = (b.price / a.price - 1) * 100;
    const data = this._data();
    const i1 = data.findIndex((r) => r.time === a.time), i2 = data.findIndex((r) => r.time === b.time);
    const bars = i1 >= 0 && i2 >= 0 ? Math.abs(i2 - i1) : "?";
    const lines = [`${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%`, `${fp(a.price)} → ${fp(b.price)}`, `słupki: ${bars}`];
    ctx.font = "12px Segoe UI";
    const w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 16;
    const bx = Math.min(Math.max(4, x2 + 10), (ctx.canvas?.width ?? 9999) - w - 4);
    const by = Math.max(4, y2 - 52);
    ctx.fillStyle = `rgba(${col},0.95)`;
    ctx.beginPath(); ctx.roundRect(bx, by, w, 50, 6); ctx.fill();
    ctx.fillStyle = "#fff";
    lines.forEach((l, i) => ctx.fillText(l, bx + 8, by + 15 + i * 15));
  }
  _fibo(ctx, x1, x2, a, b, mediaSize) {
    const xa = Math.min(x1, x2), xb = Math.max(x1, x2);
    ctx.font = "11px Segoe UI";
    for (const lv of fiboBetween(a.price, b.price)) {
      const y = this._s.priceToCoordinate(lv.price);
      if (y === null) continue;
      ctx.strokeStyle = "rgba(245,197,24,0.75)";
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(xa, y); ctx.lineTo(xb, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#f5c518";
      ctx.fillText(`${lv.label}  ${fp(lv.price)}`, Math.min(xb + 6, (mediaSize?.width ?? 9999) - 90), y + 4);
    }
  }
}

class ChmuraChart {
  constructor(el) {
    this.el = el;
    this.chart = LightweightCharts.createChart(el, {
      layout: { background: { color: kolorCss("--bg", "#131722") },
                textColor: kolorCss("--text", "#d1d4dc") },
      grid: { vertLines: { color: "#1e222d" }, horzLines: { color: "#1e222d" } },
      crosshair: { mode: 0 },
      timeScale: { timeVisible: true, borderColor: "#2a2e39" },
      rightPriceScale: { borderColor: "#2a2e39" },
      autoSize: true,
    });
    this.candles = this.chart.addCandlestickSeries({
      upColor: "#26a69a", downColor: "#ef5350", wickUpColor: "#26a69a",
      wickDownColor: "#ef5350", borderVisible: false,
      priceFormat: { type: "price", precision: 8, minMove: 1e-8 },
    });
    this.volume = this.chart.addHistogramSeries({
      priceScaleId: "vol", priceFormat: { type: "volume" }, color: "#26a69a55",
    });
    this.baseline = this.chart.addLineSeries({
      priceScaleId: "vol", color: "#f5c518", lineWidth: 1,
      priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
    });
    this.chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.78, bottom: 0 } });
    this.ichSeries = []; this.fibSeries = [];
    this.maSeries = {}; this.data = [];
    this._spans = null; this._cloud = null;

    this.tool = new ToolPrimitive(this.chart, this.candles, () => this.data);
    this.candles.attachPrimitive(this.tool);
    this._sigDots = [];
    this._dotsPrim = new SignalDotsPrimitive(this.chart, this.candles, () => this._sigDots);
    this.candles.attachPrimitive(this._dotsPrim);
    // narzedzia rysowane PRZECIAGNIECIEM (palcem/myszka), jak na TradingView
    this._dragging = false;
    this._capturedId = null;
    el.addEventListener("pointerdown", (e) => {
      if (!this.tool.mode && !this.tool.pending && this.tool.drawings.length) {
        // najpierw: czy lapiemy UCHWYT zaznaczonego rysunku (zmiana ksztaltu)?
        const u = this._uchwytPod(e);
        if (u) {
          this._edycja = u;
          this._dragging = true;
          this._setPan(false);
          try { el.setPointerCapture(e.pointerId); this._capturedId = e.pointerId; } catch (_e) { /* ok */ }
          e.preventDefault();
          return;
        }
        // klik w rysunek = zaznaczenie; ponowny klik i przeciagniecie = przesuniecie
        const idx = this._trafiony(e);
        if (idx !== null && idx === this.tool.sel) {
          const tp = this._toTimePrice(e);
          if (tp) {
            this._edycja = { idx, punkt: "calosc", start: tp,
                             kopia: JSON.parse(JSON.stringify(this.tool.drawings[idx])) };
            this._dragging = true;
            this._setPan(false);
            try { el.setPointerCapture(e.pointerId); this._capturedId = e.pointerId; } catch (_e) { /* ok */ }
            e.preventDefault();
            return;
          }
        }
        if (idx !== null || this.tool.sel != null) {
          this.tool.sel = idx;
          this.tool.refresh();
          // pokaz przycisk usuwania przy zaznaczonym rysunku (dotyk nie ma Delete)
          if (this.onZaznaczenie) {
            const rect = this.el.getBoundingClientRect();
            this.onZaznaczenie(idx !== null, e.clientX - rect.left, e.clientY - rect.top);
          }
        }
      }
      if (!this.tool.mode || this._dragging) return;      // drugi palec nie psuje rysowania
      if (e.button != null && e.button !== 0) return;     // tylko lewy przycisk / palec
      e.preventDefault();
      const tp = this._toTimePrice(e);
      if (!tp) return;
      this._dragging = true;
      this._setPan(false);                                // pan na pewno wylaczony w trakcie
      // capture: pointerup/move trafiaja do nas nawet gdy palec zjedzie z wykresu
      try { el.setPointerCapture(e.pointerId); this._capturedId = e.pointerId; }
      catch (_e) { this._capturedId = null; }
      if (this.tool.pending) {              // kanal: trzeci punkt ustawia szerokosc
        this.tool.drawings.push({ ...this.tool.pending, c: tp });
        this.tool.pending = null; this.tool.mode = null; this.tool.p1 = null;
        this._dragging = false; this._releaseCapture(); this._setPan(true);
        this.el.style.cursor = "default";
        this._saveDrawings(); this.tool.refresh();
        return;
      }
      this.tool.p1 = tp; this.tool.preview = tp;
      this.tool.refresh();                                // podglad widoczny od razu
    }, { passive: false });
    el.addEventListener("pointermove", (e) => {
      if (this._edycja) {
        const tp = this._toTimePrice(e);
        if (!tp) return;
        const d = this.tool.drawings[this._edycja.idx];
        if (!d) return;
        if (this._edycja.punkt === "calosc") {
          // przesuniecie calego rysunku o roznice wzgledem miejsca chwytu
          const k = this._edycja.kopia, s0 = this._edycja.start;
          const dt = tp.time - s0.time, dp = tp.price / (s0.price || 1);
          for (const nazwa of ["a", "b", "c"]) {
            if (!k[nazwa]) continue;
            d[nazwa] = { time: this._najblizszyCzas(k[nazwa].time + dt), price: k[nazwa].price * dp };
          }
        } else {
          d[this._edycja.punkt] = tp;
        }
        this.tool.refresh();
        e.preventDefault();
        return;
      }
      if (!this._dragging) return;
      if (this._capturedId != null && e.pointerId !== this._capturedId) return;
      e.preventDefault();
      const tp = this._toTimePrice(e);
      if (tp) { this.tool.preview = tp; this.tool.refresh(); }
    }, { passive: false });
    const finish = (e) => {
      if (this._edycja) {
        this._edycja = null;
        this._dragging = false;
        this._releaseCapture();
        this._setPan(true);
        this._saveDrawings();
        this.tool.refresh();
        return;
      }
      if (!this._dragging) return;
      if (this._capturedId != null && e.pointerId !== this._capturedId) return;
      this._dragging = false;
      this._releaseCapture();
      const tp = this._toTimePrice(e) ?? this.tool.preview;
      const t = this.tool, a = t.p1;
      if (t.mode === "hline" && a) {
        t.drawings.push({ type: "hline", a });
      } else if (t.mode === "channel" && a && tp) {
        t.pending = { type: "channel", a, b: tp };   // czekamy na klik z szerokoscia
        t.p1 = null; t.refresh();
        return;
      } else if (a && tp) {
        t.drawings.push({ type: t.mode, a, b: tp });
      }
      t.mode = null; t.p1 = null; t.preview = null;   // rysunek zostaje na wykresie
      this._setPan(true);
      this.el.style.cursor = "default";
      this._saveDrawings();
      t.refresh();
    };
    el.addEventListener("pointerup", finish, { passive: false });
    el.addEventListener("pointercancel", finish, { passive: false });
  }

  _releaseCapture() {
    if (this._capturedId == null) return;
    try { this.el.releasePointerCapture(this._capturedId); } catch (_e) { /* juz zwolnione */ }
    this._capturedId = null;
  }

  _toTimePrice(e) {
    const rect = this.el.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const logical = this.chart.timeScale().coordinateToLogical(x);
    if (logical === null || !this.data.length) return null;
    const i = Math.max(0, Math.min(this.data.length - 1, Math.round(logical)));
    const price = this.candles.coordinateToPrice(y);
    if (price === null) return null;
    return { time: this.data[i].time, price };
  }

  _setPan(on) {
    // pan/zoom nie moze sie wlaczyc w POLOWIE przeciagania ani gdy narzedzie uzbrojone
    if (on && (this._dragging || this.tool?.mode)) return;
    this.chart.applyOptions({ handleScroll: on, handleScale: on });
    this.el.style.touchAction = on ? "auto" : "none";
  }

  setData(rows) {
    this.data = rows;
    this.candles.setData(rows);
    this.volume.setData(rows.map((r) => ({
      time: r.time, value: r.vol, color: r.close >= r.open ? "#26a69a55" : "#ef535055",
    })));
    const med = rollMedianShift1(rows.map((r) => r.vol), 30, 20);
    this.baseline.setData(rows.map((r, i) => ({ time: r.time, value: med[i] }))
      .filter((p) => Number.isFinite(p.value)));
    for (const key of Object.keys(this.maSeries)) this._refreshMA(key);
    if (this.ichSeries.length) { this.toggleIchimoku(); this.toggleIchimoku(); }
    this.clearTool();
    this.chart.timeScale().fitContent();
  }

  updateLast(t) {
    const last = this.data[this.data.length - 1];
    const row = { time: t.id, open: t.open, high: t.high, low: t.low, close: t.close, vol: t.vol, count: t.count };
    if (last && t.id < last.time) return;
    if (last && t.id === last.time) this.data[this.data.length - 1] = row;
    else this.data.push(row);
    this.candles.update({ time: row.time, open: row.open, high: row.high, low: row.low, close: row.close });
    this.volume.update({ time: row.time, value: row.vol, color: row.close >= row.open ? "#26a69a55" : "#ef535055" });
  }

  // znaczniki na KAZDYM interwale: sygnal (doba HTX) przyciagany do pierwszej
  // swiecy danego dnia, delisting do najblizszej swiecy
  setMarkersAll(signals, delistings) {
    if (!this.data.length) { this.candles.setMarkers([]); this._sigDots = []; return; }
    const times = this.data.map((r) => r.time);
    const snap = (t) => {
      let lo = 0, hi = times.length - 1, ans = null;
      while (lo <= hi) {
        const m = (lo + hi) >> 1;
        if (times[m] >= t) { ans = times[m]; hi = m - 1; } else lo = m + 1;
      }
      if (ans !== null && ans - t < 86400) return ans;          // pierwsza swieca doby
      return times[times.length - 1] >= t - 86400 ? null : null;
    };
    const marks = [];
    const dots = [];
    for (const s of signals) {
      const mk = KIND_MARK[s.kind];
      if (!mk) continue;
      // kanaly i formacje NIE dostaja znacznikow ani kropek - rysujemy je
      // ksztaltem na wykresie, zeby nie zaslaniac ceny punktami
      if (/^(kanal|dno)_/.test(String(s.kind))) continue;
      const t = snap(Math.floor(Date.parse(s.ts) / 1000));
      if (t === null) continue;
      marks.push({ time: t, position: mk.shape === "arrowDown" ? "aboveBar" : "belowBar",
                   color: mk.color, shape: mk.shape, text: mk.text });
      // kropka DOKLADNIE na cenie sygnalu - tylko gdy detail ma cene
      const px = signalPrice(s.detail);
      if (px != null) dots.push({ time: t, price: px, color: mk.color });
    }
    this._sigDots = dots;
    // KANALY wykryte przez system - rysowane jako linie, osobno od recznych rysunkow
    this._auto = [];
    for (const s of signals) {
      if (s.kind !== `kanal_${this._iv}`) continue;
      let d = s.detail;
      if (typeof d === "string") { try { d = JSON.parse(d); } catch (_e) { continue; } }
      if (!d || !d.t1 || !d.t2) continue;
      this._auto.push({ t1: d.t1, t2: d.t2, g1: +d.g1, g2: +d.g2, d1: +d.d1, d2: +d.d2,
                        kier: d.kier, alert: d.alert });
    }
    // FORMACJE (podwojne dno / szczyt) - ksztalt: dwa ekstrema + linia szyi
    this._form = [];
    for (const s of signals) {
      if (s.kind !== `dno_${this._iv}`) continue;
      let d = s.detail;
      if (typeof d === "string") { try { d = JSON.parse(d); } catch (_e) { continue; } }
      if (!d || !d.t1 || !d.t2 || !d.szyja) continue;
      this._form.push({ t1: d.t1, t2: d.t2, p1: +d.p1, p2: +d.p2, szyja: +d.szyja,
                        typ: d.typ, kierunek: d.kierunek, alert: d.alert });
    }
    if (this.tool) this.tool.formacje = this._form;
    this._odswiezKanaly();
    if (this._srOn) this.tool.levels = this._liczPoziomy();
    for (const d of delistings || []) {
      const t = snap(Math.floor(Date.parse(d.published_at || d.seen_at) / 1000));
      if (t !== null) marks.push({ time: t, position: "aboveBar", color: "#ff1744",
                                   shape: "square", text: `DELIST:${(d.source || "").toUpperCase()}` });
    }
    marks.sort((a, b) => a.time - b.time);
    this.candles.setMarkers(marks);
  }

  // Poziomy z historii wykresu: punkty zwrotne (potwierdzone 3 swiecami z kazdej
  // strony) sklejone w grupy o zblizonej cenie. Liczba dotkniec = sila poziomu.
  _liczPoziomy() {
    const d = this.data;
    if (!d || d.length < 30) return [];
    const k = 3, punkty = [];
    for (let i = k; i < d.length - k; i++) {
      let maxH = -Infinity, minL = Infinity;
      for (let j = i - k; j <= i + k; j++) { maxH = Math.max(maxH, d[j].high); minL = Math.min(minL, d[j].low); }
      if (d[i].high === maxH) punkty.push(d[i].high);
      if (d[i].low === minL) punkty.push(d[i].low);
    }
    if (!punkty.length) return [];
    punkty.sort((a, b) => a - b);
    const px = d[d.length - 1].close;
    const tol = px * 0.012;                    // poziomy blizsze niz 1,2% to jeden poziom
    const grupy = [];
    let biez = [punkty[0]];
    for (let i = 1; i < punkty.length; i++) {
      if (punkty[i] - biez[biez.length - 1] <= tol) biez.push(punkty[i]);
      else { grupy.push(biez); biez = [punkty[i]]; }
    }
    grupy.push(biez);
    return grupy
      .filter((g) => g.length >= 2)            // pojedyncze zawrocenie to nie poziom
      .map((g) => {
        const cena = g.reduce((a, b) => a + b, 0) / g.length;
        return { price: cena, dotkniecia: g.length, typ: cena >= px ? "opor" : "wsparcie" };
      })
      .filter((p) => Math.abs(p.price / px - 1) <= 0.6)   // tylko w zasiegu wzroku
      .sort((a, b) => b.dotkniecia - a.dotkniecia || Math.abs(a.price - px) - Math.abs(b.price - px))
      .slice(0, 8);
  }

  // Kanal z ostatnich 60 swiec, liczony na miejscu - dzieki temu widac go zawsze,
  // a nie tylko wtedy, gdy chmura zapisala zdarzenie. Progi luzniejsze niz alertowe.
  // KANAL metoda klasyczna (zrodla: Tradeciety, TradingView, Navia):
  //  1. linia bazowa laczy MIN. 3 punkty zwrotne i nie jest przez cene przebijana
  //     (do ostatniego dotkniecia - pozniejsze wyjscie to juz wybicie, nie blad),
  //  2. druga krawedz to ROWNOLEGLA kopia oparta na SKUPISKU punktow po drugiej
  //     stronie (nie na pojedynczym knocie),
  //  3. wiekszosc zamkniec musi lezec w srodku; inaczej NIE RYSUJEMY nic.
  _liczKanal(dane = null) {
    // ten sam kanal widziany z rozna dokladnoscia: na 1h potrzeba wiecej swiec,
    // zeby zlapac strukture, ktora na 4h miesci sie w kilkudziesieciu
    const d = dane || this.data;
    let naj = null;
    for (const okno of [120, 220, 400, 800, 1400]) {
      if (d && okno > d.length + 100) break;
      const k = this._kanalWOknie(okno, d);
      if (k && (!naj || k.dotkniecia > naj.dotkniecia ||
                (k.dotkniecia === naj.dotkniecia && k.swiec > naj.swiec))) naj = k;
    }
    return naj;
  }

  // Kanaly z WYZSZYCH interwalow rysowane na biezacym wykresie - trader zaznacza
  // strukture na 1D/4H, a wchodzi precyzyjnie na nizszym. Linie sa w tej samej
  // przestrzeni (czas, cena), wiec przenosza sie bez przeliczen.
  setKanalyRef(zestawy) {
    this._ref = [];
    for (const [iv, rows] of Object.entries(zestawy || {})) {
      if (!rows || rows.length < 60) continue;
      const k = this._liczKanal(rows);
      if (k) this._ref.push({ ...k, zrodlo: iv === "1day" ? "1D" : iv === "4hour" ? "4H" : iv });
    }
    this._odswiezKanaly();
  }

  _kanalWOknie(OKNO, dane = null) {
    const d = dane || this.data;
    if (!d || d.length < 60) return null;
    const n = d.length;
    const a = Math.max(0, n - OKNO), K = 2;
    const ph = [], pl = [];
    for (let i = a + K; i < n - K; i++) {
      let mh = -Infinity, ml = Infinity;
      for (let q = i - K; q <= i + K; q++) { mh = Math.max(mh, d[q].high); ml = Math.min(ml, d[q].low); }
      if (d[i].high === mh) ph.push(i);
      if (d[i].low === ml) pl.push(i);
    }
    if (ph.length < 2 || pl.length < 2) return null;
    const zak = d.slice(a).map((r) => r.high - r.low).sort((x, y) => x - y);
    const med = zak[zak.length >> 1] || 0;
    const px = d[n - 1].close;
    const tol = Math.max(0.4 * med, 0.003 * px);

    const bazowa = (idx, gora) => {
      const ex = (i) => (gora ? d[i].high : d[i].low);
      let best = null;
      for (let x = 0; x < idx.length - 1; x++) {
        for (let y = x + 1; y < idx.length; y++) {
          const i1 = idx[x], i2 = idx[y];
          if (i2 - i1 < 10) continue;
          const nach = (ex(i2) - ex(i1)) / (i2 - i1);
          const b = ex(i1) - nach * i1;
          const dot = idx.filter((p) => p >= i1 && Math.abs(ex(p) - (nach * p + b)) <= tol);
          if (dot.length < 3) continue;                  // linia z 3 dotkniec, nie z dwoch
          const ost = Math.max(...dot);
          // dopuszczamy pojedyncze knoty poza linia (1 na 60 swiec) - inaczej
          // na wykresie godzinowym szum kasowalby poprawne kanaly
          const limit = Math.max(1, Math.floor((ost - i1) / 60));
          let naruszen = 0;
          for (let q = i1; q <= ost; q++) {
            const v = nach * q + b;
            if (gora ? d[q].high > v + tol : d[q].low < v - tol) naruszen++;
          }
          if (naruszen > limit) continue;
          const oc = dot.length * 100 + (ost - i1);
          if (!best || oc > best.oc) best = { oc, nach, b, dot: dot.length, i1 };
        }
      }
      return best;
    };

    for (const goraBaza of [true, false]) {
      const baza = bazowa(goraBaza ? ph : pl, goraBaza);
      if (!baza) continue;
      const { nach, b, i1 } = baza;
      // rownolegla po drugiej stronie: przesuniecie ze SKUPISKA punktow zwrotnych
      const idx2 = goraBaza ? pl : ph;
      const ex2 = (i) => (goraBaza ? d[i].low : d[i].high);
      const kand = idx2.filter((p) => p >= i1).map((p) => ex2(p) - nach * p);
      if (kand.length < 2) continue;
      let naj = null;
      for (const cc of kand) {
        const ile = kand.filter((c2) => Math.abs(c2 - cc) <= tol).length;
        const poza = kand.filter((c2) => (goraBaza ? c2 < cc - tol : c2 > cc + tol)).length;
        const oc = ile * 100 - poza;
        if (!naj || oc > naj.oc) naj = { oc, cc, ile };
      }
      if (!naj || naj.ile < 2) continue;
      const cG = goraBaza ? b : naj.cc;
      const cD = goraBaza ? naj.cc : b;
      const wys = cG - cD;
      if (!(wys > 0) || wys / px < 0.03 || wys / px > 0.8) continue;
      let w = 0, ile = 0;
      for (let q = i1; q < n; q++) {
        const g = nach * q + cG, dd = nach * q + cD;
        if (d[q].close <= g + tol && d[q].close >= dd - tol) w++;
        ile++;
      }
      if (w / ile < 0.80) continue;                      // cena musi RESPEKTOWAC kanal
      const nachRel = nach / px;
      return {
        t1: d[i1].time, t2: d[n - 1].time,
        g1: nach * i1 + cG, g2: nach * (n - 1) + cG,
        d1: nach * i1 + cD, d2: nach * (n - 1) + cD,
        kier: nachRel > 0.0008 ? "wzrostowy" : nachRel < -0.0008 ? "spadkowy" : "boczny",
        wys_pct: (wys / px) * 100, dotkniecia: baza.dot + naj.ile, swiec: n - i1,
        alert: null, lokalny: true,
      };
    }
    return null;
  }

  // SCIANY z arkusza: gruba pozioma kreska na poziomie duzego zlecenia
  setSciany(lista) {
    this.tool.sciany = (lista || []).map((w) => ({
      price: +w.price, side: w.side, usd: +w.usd, pct: +w.pct_vol24,
    }));
    this.tool.refresh();
  }

  togglePoziomy() {
    this._srOn = !this._srOn;
    this.tool.levels = this._srOn ? this._liczPoziomy() : [];
    this.tool.refresh();
    return this._srOn;
  }

  toggleKanaly() {
    this._kanalyOff = !this._kanalyOff;
    this._odswiezKanaly();
    return !this._kanalyOff;
  }

  _odswiezKanaly() {
    if (this._kanalyOff) { this.tool.auto = []; this.tool.refresh(); return; }
    const lokalny = this._liczKanal();
    const ivPl = this._iv === "1day" ? "1D" : this._iv === "4hour" ? "4H"
               : this._iv === "60min" ? "1H" : "15m";
    const biezacy = lokalny ? [{ ...lokalny, zrodlo: ivPl }] : [];
    // kanaly z wyzszych interwalow - pomijamy ten, ktory juz mamy z biezacego
    const ref = (this._ref ?? []).filter((k) => k.zrodlo !== ivPl);
    this.tool.auto = [...biezacy, ...ref, ...(this._auto ?? [])];
    this.tool.refresh();
  }

  // przemalowanie wykresu po zmianie motywu
  odswiezMotyw() {
    this.chart.applyOptions({
      layout: { background: { color: kolorCss("--bg", "#131722") },
                textColor: kolorCss("--text", "#d1d4dc") },
      grid: { vertLines: { color: kolorCss("--border", "#2a2e39") },
              horzLines: { color: kolorCss("--border", "#2a2e39") } },
    });
    this.tool.refresh();
  }

  toggleMA(key) {
    if (this.maSeries[key]) {
      this.chart.removeSeries(this.maSeries[key]); delete this.maSeries[key]; return false;
    }
    this.maSeries[key] = this.chart.addLineSeries({
      color: MA_DEFS[key].color, lineWidth: 1, priceLineVisible: false,
      lastValueVisible: false, crosshairMarkerVisible: false, title: key,
    });
    this._refreshMA(key);
    return true;
  }
  _refreshMA(key) { this.maSeries[key].setData(MA_DEFS[key].fn(this.data, MA_DEFS[key].n)); }

  toggleIchimoku() {
    if (this.ichSeries.length) {
      if (this._cloud) { this.candles.detachPrimitive(this._cloud); this._cloud = null; }
      this.ichSeries.forEach((s) => this.chart.removeSeries(s)); this.ichSeries = [];
      this._spans = null;
      return false;
    }
    const ich = ichimoku(this.data);
    this._spans = { spanA: ich.spanA, spanB: ich.spanB };
    const mk = (color, data) => {
      const s = this.chart.addLineSeries({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
      s.setData(data); this.ichSeries.push(s);
    };
    mk("#2962ff", ich.tenkan); mk("#b71c1c", ich.kijun);
    mk("#26a69a88", ich.spanA); mk("#ef535088", ich.spanB); mk("#78909c", ich.chikou);
    this._cloud = new CloudPrimitive(this.chart, this.candles, () => this._spans);
    this.candles.attachPrimitive(this._cloud);
    return true;
  }

  toggleFibo() {
    if (this.fibSeries.length) {
      this.fibSeries.forEach((s) => this.chart.removeSeries(s)); this.fibSeries = []; return false;
    }
    const t0 = this.data[Math.max(0, this.data.length - 180)]?.time, t1 = this.data[this.data.length - 1]?.time;
    for (const lv of fiboLevels(this.data, 180)) {
      const s = this.chart.addLineSeries({ color: "#f5c51888", lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: true, title: `Fibo ${lv.label}`, crosshairMarkerVisible: false });
      s.setData([{ time: t0, value: lv.price }, { time: t1, value: lv.price }]);
      this.fibSeries.push(s);
    }
    return true;
  }

  // --- narzedzia (przeciaganie) ---
  armTool(mode) {
    if (this.tool.mode === mode) { this.clearTool(); return; }   // drugi klik = rozbroj
    this.clearTool();
    this.tool.mode = mode;
    this._setPan(false);                 // na czas rysowania wykres nie panuje
    this.el.style.cursor = "crosshair";
  }
  // rozbraja narzedzie, ale ZOSTAWIA narysowane obiekty na wykresie
  clearTool() {
    this.tool.mode = null; this.tool.p1 = null; this.tool.preview = null; this.tool.pending = null;
    this._dragging = false;
    this._releaseCapture();
    this._setPan(true);
    this.tool.refresh();
    this.el.style.cursor = "default";
  }
  // gumka: usuwa ZAZNACZONY rysunek, a gdy nic nie zaznaczone - ostatni;
  // z argumentem true czysci wszystkie
  eraseTool(wszystko = false) {
    if (this.onZaznaczenie) this.onZaznaczenie(false, 0, 0);
    if (wszystko) this.tool.drawings = [];
    else if (this.tool.sel != null && this.tool.drawings[this.tool.sel]) {
      this.tool.drawings.splice(this.tool.sel, 1);
    } else this.tool.drawings.pop();
    this.tool.sel = null;
    this.clearTool();
    this._saveDrawings();
  }

  // ktory uchwyt zaznaczonego rysunku jest pod kursorem (promien 12 px)
  _uchwytPod(e) {
    const idx = this.tool.sel;
    if (idx == null || !this.tool.drawings[idx]) return null;
    const d = this.tool.drawings[idx];
    const rect = this.el.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const ts = this.chart.timeScale();
    for (const nazwa of ["a", "b", "c"]) {
      const q = d[nazwa];
      if (!q) continue;
      const x = ts.timeToCoordinate(q.time), y = this.candles.priceToCoordinate(q.price);
      if (x === null || y === null) continue;
      if (Math.hypot(mx - x, my - y) <= 12) return { idx, punkt: nazwa };
    }
    return null;
  }

  // czas przyciagany do istniejacej swiecy (wykres nie zna czasow pomiedzy)
  _najblizszyCzas(t) {
    if (!this.data.length) return t;
    let best = this.data[0].time, bd = Math.abs(t - best);
    for (const r of this.data) {
      const dd = Math.abs(r.time - t);
      if (dd < bd) { bd = dd; best = r.time; }
    }
    return best;
  }

  // trafienie w rysunek: zwraca indeks najblizszego w promieniu ~10 px
  _trafiony(e) {
    const rect = this.el.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const ts = this.chart.timeScale();
    const xy = (pt) => {
      if (!pt) return null;
      const x = ts.timeToCoordinate(pt.time), y = this.candles.priceToCoordinate(pt.price);
      return (x === null || y === null) ? null : { x, y };
    };
    const odcinek = (A, B) => {
      const dx = B.x - A.x, dy = B.y - A.y;
      const t = Math.max(0, Math.min(1, ((mx - A.x) * dx + (my - A.y) * dy) / (dx * dx + dy * dy || 1)));
      return Math.hypot(mx - (A.x + t * dx), my - (A.y + t * dy));
    };
    let best = null, bestD = 11;
    this.tool.drawings.forEach((d, idx) => {
      const A = xy(d.a), B = d.b ? xy(d.b) : null;
      if (!A) return;
      let dist = Infinity;
      if (d.type === "hline") dist = Math.abs(my - A.y);
      else if (B) {
        dist = odcinek(A, B);
        if (d.type === "rect") {
          const x1 = Math.min(A.x, B.x), x2 = Math.max(A.x, B.x);
          const y1 = Math.min(A.y, B.y), y2 = Math.max(A.y, B.y);
          dist = Math.min(Math.abs(mx - x1), Math.abs(mx - x2), Math.abs(my - y1), Math.abs(my - y2));
          if (mx < x1 - 10 || mx > x2 + 10 || my < y1 - 10 || my > y2 + 10) dist = Infinity;
        }
      }
      if (dist < bestD) { bestD = dist; best = idx; }
    });
    return best;
  }
  // rysunki zapisywane per para i interwal - wracaja po odswiezeniu strony
  setDrawKey(symbol, interval) {
    this._iv = interval;
    this._ivBiez = interval === "1day" ? "1D" : interval === "4hour" ? "4H"
                 : interval === "60min" ? "1H" : "15m";
    this.tool._ivBiez = this._ivBiez;            // kanaly rysujemy tylko z TEGO interwalu
    this._drawKey = `chmura.rys.${symbol}.${interval}`;
    try {
      const raw = localStorage.getItem(this._drawKey);
      this.tool.drawings = raw ? JSON.parse(raw) : [];
    } catch (_e) { this.tool.drawings = []; }
    this.tool.refresh();
  }
  _saveDrawings() {
    if (!this._drawKey) return;
    try { localStorage.setItem(this._drawKey, JSON.stringify(this.tool.drawings.slice(-60))); }
    catch (_e) { /* brak miejsca - rysunki zostaja tylko na ekranie */ }
  }
}


// Arkusz bid/ask + kalkulator plynnosci (market-impact) i prowizji.
const fmtP = (p) => (p >= 1 ? p.toFixed(4) : p.toPrecision(5));
const fmtN = (v) => Math.round(v).toLocaleString("pl-PL");

// Doklejanie zmian arkusza: aktualizuje poziomy, usuwa te z iloscia 0
// i trzyma sortowanie (kupno malejaco, sprzedaz rosnaco).
function scalPoziomy(stare, zmiany, rosnaco) {
  if (!zmiany || !zmiany.length) return stare;
  const mapa = new Map(stare.map(([p, q]) => [p, q]));
  const skraj = rosnaco ? Math.max(...zmiany.map(([p]) => +p))
                       : Math.min(...zmiany.map(([p]) => +p));
  // w zasiegu przyslanej czesci arkusza obowiazuje to, co przyszlo:
  // poziomy, ktorych juz nie ma, znikaja (ktos je zdjal albo zostaly zjedzone)
  for (const cena of [...mapa.keys()]) {
    if (rosnaco ? cena <= skraj : cena >= skraj) mapa.delete(cena);
  }
  for (const [p, q] of zmiany) {
    const cena = +p, ilosc = +q;
    if (ilosc > 0) mapa.set(cena, ilosc);
  }
  return [...mapa.entries()]
    .sort((a, b) => (rosnaco ? a[0] - b[0] : b[0] - a[0]))
    .slice(0, 150);
}

class OrderBook {
  constructor(bookEl, calcEls) {
    this.el = bookEl; this.c = calcEls;
    this.bids = []; this.asks = [];
    ["qty", "entry", "fee", "conv", "side"].forEach((k) =>
      this.c[k].addEventListener("input", () => this.recalc()));
    this.c.mode.addEventListener("change", () => this.recalc());
  }

  update(tick, pelny = false) {
    const nowe = {
      bids: (tick.bids || []).map(([p, q]) => [+p, +q]),
      asks: (tick.asks || []).map(([p, q]) => [+p, +q]),
    };
    if (pelny || !this.bids.length) {
      this.bids = nowe.bids;
      this.asks = nowe.asks;
    } else {
      // czubek arkusza z subskrypcji: odswieza pierwsze poziomy, ale NIE obcina
      // glebszej czesci pobranej migawka
      this.bids = scalPoziomy(this.bids, nowe.bids, false);
      this.asks = scalPoziomy(this.asks, nowe.asks, true);
    }
    this.render();
    this.recalc();
  }

  render(depth = this.glebokosc ?? 12) {
    if (!this.bids.length) { this.el.textContent = "brak danych arkusza"; return; }
    const maxQ = Math.max(...this.asks.slice(0, depth).map(([, q]) => q),
                          ...this.bids.slice(0, depth).map(([, q]) => q));
    const row = (p, q, cls) => `
      <div class="row ${cls}">
        <span class="p">${fmtP(p)}</span><span>${fmtN(q)}</span><span>${fmtN(p * q)} $</span>
        <span class="bar" style="width:${(q / maxQ) * 100}%;background:${cls === "ask" ? "#ef5350" : "#26a69a"}"></span>
      </div>`;
    const spread = this.asks[0][0] - this.bids[0][0];
    const spreadPct = (spread / this.asks[0][0]) * 100;
    this.el.innerHTML =
      [...this.asks.slice(0, depth)].reverse().map(([p, q]) => row(p, q, "ask")).join("") +
      `<div class="spread">spread ${fmtP(spread)} (${spreadPct.toFixed(2)}%)</div>` +
      this.bids.slice(0, depth).map(([p, q]) => row(p, q, "bid")).join("");
  }

  // zejscie po arkuszu: ile dostane / zaplace i do jakiej ceny zejde
  walk(levels, qty) {
    let remaining = qty, quote = 0, worst = null;
    for (const [p, q] of levels) {
      const take = Math.min(remaining, q);
      quote += take * p; remaining -= take; worst = p;
      if (remaining <= 0) break;
    }
    return { filledQty: qty - remaining, quote, worst, unfilled: remaining };
  }

  // zejscie po arkuszu az do uzbierania docelowej KWOTY w USD
  walkQuote(levels, targetQuote) {
    let remainingQ = targetQuote, qty = 0, quote = 0, worst = null;
    for (const [p, q] of levels) {
      const lvlQuote = p * q;
      const takeQ = Math.min(remainingQ, lvlQuote);
      qty += takeQ / p; quote += takeQ; remainingQ -= takeQ; worst = p;
      if (remainingQ <= 0) break;
    }
    return { filledQty: qty, quote, worst, unfilledQuote: remainingQ };
  }

  recalc() {
    const out = this.c.out;
    const amount = parseFloat(this.c.qty.value);
    if (!Number.isFinite(amount) || amount <= 0 || !this.bids.length) {
      out.innerHTML = `<div class="muted">Podaj kwotę — liczę po żywym arkuszu.</div>`; return;
    }
    const inCoins = this.c.mode.checked;
    const side = this.c.side.value;
    const feePct = (parseFloat(this.c.fee.value) || 0) / 100;
    const convPct = (parseFloat(this.c.conv.value) || 0) / 100;
    const entry = parseFloat(this.c.entry.value);
    const best = side === "sell" ? this.bids[0][0] : this.asks[0][0];
    const levels = side === "sell" ? this.bids : this.asks;
    let w, qty;
    if (inCoins) {
      qty = amount;
      w = this.walk(levels, qty);
    } else {
      const wq = this.walkQuote(levels, amount);
      qty = wq.filledQty;
      w = { filledQty: wq.filledQty, quote: wq.quote, worst: wq.worst,
            unfilled: wq.unfilledQuote > 0 ? wq.unfilledQuote / (wq.worst || best) : 0 };
    }
    const avg = w.quote / w.filledQty;
    const slip = Math.abs(avg / best - 1) * 100;
    const fee = w.quote * feePct;
    const conv = w.quote * convPct;
    const net = side === "sell" ? w.quote - fee - conv : -(w.quote + fee + conv);

    const L = [];
    L.push(`<div><span>Najlepsza cena</span><span>${fmtP(best)}</span></div>`);
    L.push(`<div><span>Zejdziesz do ceny</span><span><b>${fmtP(w.worst)}</b> (${(((w.worst / best) - 1) * 100).toFixed(2)}%)</span></div>`);
    L.push(`<div><span>Średnia wykonania</span><span>${fmtP(avg)} (poślizg ${slip.toFixed(2)}%)</span></div>`);
    L.push(`<div><span>Wartość ${side === "sell" ? "sprzedaży" : "zakupu"}</span><span>${fmtN(w.quote)} $</span></div>`);
    L.push(`<div><span>Prowizja transakcji (${(feePct * 100).toFixed(2)}%)</span><span>-${fmtN(fee)} $</span></div>`);
    if (convPct > 0) L.push(`<div><span>Przewalutowanie (${(convPct * 100).toFixed(2)}%)</span><span>-${fmtN(conv)} $</span></div>`);
    if (side === "sell") {
      L.push(`<div class="net"><span>NA RĘKĘ</span><span>${fmtN(net)} $</span></div>`);
      if (Number.isFinite(entry) && entry > 0) {
        const cost = qty * entry;
        const entryFee = cost * feePct;
        const pnl = net - cost - entryFee;
        L.push(`<div><span>Koszt wejścia (z prowizją)</span><span>${fmtN(cost + entryFee)} $</span></div>`);
        L.push(`<div class="net"><span>ZYSK/STRATA</span><span style="color:${pnl >= 0 ? "#26a69a" : "#ef5350"}">${pnl >= 0 ? "+" : ""}${fmtN(pnl)} $ (${((pnl / (cost + entryFee)) * 100).toFixed(1)}%)</span></div>`);
      }
    } else {
      L.push(`<div class="net"><span>ZAPŁACISZ ŁĄCZNIE</span><span>${fmtN(-net)} $</span></div>`);
    }
    if (w.unfilled > 0) {
      L.push(`<div class="warn"><span>UWAGA: arkusz za płytki</span><span>nie zmieści się ${fmtN(w.unfilled)} szt.</span></div>`);
    }
    out.innerHTML = L.join("");
  }
}

const fmtUsd = (v) => v == null ? "—" : Math.round(v).toLocaleString("pl-PL") + " $";
const fmtPx = (v) => v == null ? "—" : (v >= 1 ? v.toFixed(4) : v.toPrecision(5));
// wolumen krotko, po polsku: 217 tys. $ / 1,3 mln $ / 2,1 mld $
const fmtVolPl = (v) => {
  if (v == null || !Number.isFinite(v)) return "—";
  if (v >= 1e9) return (v / 1e9).toFixed(1).replace(".", ",") + " mld $";
  if (v >= 1e6) return (v / 1e6).toFixed(1).replace(".", ",") + " mln $";
  if (v >= 1e3) return Math.round(v / 1e3) + " tys. $";
  return Math.round(v) + " $";
};

let _titleTs = 0;
function setDocTitle(px, force = false) {
  const now = Date.now();
  if (!force && now - _titleTs < 1000) return;
  const name = state.symbol.toUpperCase().replace(/USDT$/, "");
  document.title = px != null ? `${name} ${fmtPx(px)} | Chmura` : `${name} | Chmura`;
  _titleTs = px != null ? now : 0;   // tytul bez ceny nie blokuje najblizszej aktualizacji
}

let _rowPxTs = 0;
function setHeaderPrice(px) {
  state.lastPx[state.symbol] = px;
  $("h-px").textContent = fmtPx(px);
  const first = chart.data[Math.max(0, chart.data.length - 2)];
  if (first) {
    const chg = (px / first.close - 1) * 100;
    const el = $("h-chg");
    el.textContent = `${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%`;
    el.className = `chg ${chg >= 0 ? "up" : "down"}`;
  }
  setDocTitle(px);
  const now = Date.now();
  if (now - _rowPxTs >= 1000) {       // cena live takze w wierszu listy (maks. 1/s)
    _rowPxTs = now;
    const cell = document.querySelector(`[data-px="${state.symbol}"]`);
    if (cell) cell.textContent = fmtPx(px);
  }
}

async function loadSymbol(sym) {
  document.querySelector("aside").classList.remove("open");
  $("right").classList.remove("open");
  state.symbol = sym;
  $("h-sym").textContent = sym.toUpperCase().replace(/USDT$/, "/USDT");
  setDocTitle(state.lastPx[sym] ?? state.vols.get(sym)?.close ?? null, true);  // tytul od razu po zmianie coina
  document.querySelectorAll(".sym-row").forEach((r) => r.classList.toggle("active", r.dataset.sym === sym));
  const rows = await fetchCandles(sym, state.interval);
  chart.setDrawKey(sym, state.interval);     // rysunki tej pary i interwalu wracaja
  chart.setData(rows);
  // kanaly z wyzszych interwalow (1D i 4H) - widoczne takze na nizszych wykresach
  Promise.all([
    state.interval === "1day" ? Promise.resolve(rows) : fetchCandles(sym, "1day", 500),
    state.interval === "4hour" ? Promise.resolve(rows) : fetchCandles(sym, "4hour", 700),
  ]).then(([d1, d4]) => {
    if (state.symbol === sym) chart.setKanalyRef({ "1day": d1, "4hour": d4 });
  }).catch(() => { /* brak swiec wyzszego interwalu - trudno */ });
  if (rows.length) setHeaderPrice(rows[rows.length - 1].close);
  state.signals = await fetchSignals(sym);
  fetchSciany(sym).then((w) => {
    if (state.symbol === sym) chart.setSciany(w);
  }).catch(() => { /* brak scian - nic nie rysujemy */ });
  state.delist = await fetchDelistings(sym);
  chart.setMarkersAll(state.signals, state.delist);
  renderSignalsPanel();
  feed.watch(sym, HTX_PERIOD[state.interval]);
  // pasek info (wolumen / baza / kapitalizacja) - nie blokuje wykresu
  renderOrders();
  state.info = null;
  $("info-bar").innerHTML = `<span class="muted">ładowanie danych coina…</span>`;
  fetchCoinInfo(sym).then((info) => {
    if (state.symbol !== sym) return;
    state.info = info;
    renderInfoBar();
  });
}

function renderList() {
  const q = $("search").value.trim().toLowerCase();
  const onlyFav = $("only-fav").checked;
  const showAll = $("show-all").checked;
  const volsReady = state.vols.size > 0;
  const volOf = (sym) => state.vols.get(sym)?.vol ?? 0;
  let items = state.symbols
    .filter((s) => (!q || s.symbol.includes(q)) && (!onlyFav || state.fav.has(s.symbol)));
  // domyslnie chowamy male wolumeny; ★ zawsze widoczne; wracaja same gdy wolumen > prog
  if (volsReady && !showAll)
    items = items.filter((s) => state.fav.has(s.symbol) || volOf(s.symbol) >= PROG_WOLUMENU);
  if (state.sort === "alpha") items.sort((a, b) => a.symbol.localeCompare(b.symbol));
  else if (volsReady) items.sort((a, b) => state.sort === "vol-asc"
    ? volOf(a.symbol) - volOf(b.symbol) : volOf(b.symbol) - volOf(a.symbol));
  items = items.slice(0, 400);
  $("symbol-list").innerHTML = items.map((s) => {
    const v = state.vols.get(s.symbol);
    const px = state.lastPx[s.symbol] ?? v?.close;

      <td style="padding:4px 8px">${fmtPx(+r.price)}</td>
      <td style="padding:4px 8px">${fmtVolPl(+r.usd)}</td>
      <td style="padding:4px 8px">${(+r.pct_vol24).toFixed(1)}%</td>
      <td style="padding:4px 8px">${(+r.krotnosc).toFixed(0)}×</td>
      <td style="padding:4px 8px" class="muted">${(+r.dist_pct).toFixed(1)}%</td>
    </tr>`).join("");
  openModal(`Ściany w arkuszu — ostatnia doba (${w.length})`,
    `<table style="width:100%;border-collapse:collapse;font-size:12px">
      <tr class="muted"><th style="text-align:left;padding:4px 8px">kiedy</th>
      <th style="text-align:left;padding:4px 8px">coin</th><th style="text-align:left;padding:4px 8px">strona</th>
      <th style="text-align:left;padding:4px 8px">cena</th><th style="text-align:left;padding:4px 8px">wartość</th>
      <th style="text-align:left;padding:4px 8px">% obrotu</th><th style="text-align:left;padding:4px 8px">× arkusz</th>
      <th style="text-align:left;padding:4px 8px">od ceny</th></tr>${rows}</table>
     <p class="muted" style="margin-top:8px">Ściana = pojedyncze zlecenie co najmniej 6× większe od typowego
     poziomu w arkuszu i warte ponad 3% dziennego obrotu, stojące do 4% od ceny. Skan co 10 minut, rotacyjnie
     po całej giełdzie. To OBSERWACJA, nie sygnał — zbieramy dane, żeby sprawdzić, czy ściany coś zapowiadają.</p>`);
}
$("btn-sciany").addEventListener("click", pokazSciany);

// --- zlecenia (Etap 2): draft w apce -> TAK/NIE w Telegramie -> egzekutor ---
const ORDER_ST = { draft: "czeka na TAK w Telegramie", armed: "uzbrojone", running: "w trakcie",
                   done: "zakończone", cancelled: "anulowane", error: "BŁĄD" };
async function renderOrders() {
  const os = await fetchOrders(state.symbol);
  $("o-list").innerHTML = os.length
    ? os.map((o) => `<div class="sig">#${o.id} ${o.mode} ${Math.round(o.done_usdt)}/${Math.round(o.budget_usdt)} $
        — <span class="${o.status === 'error' ? '' : 'muted'}">${ORDER_ST[o.status] ?? o.status}</span></div>`).join("")
    : "";
}
$("o-mode").addEventListener("change", () => {
  const m = $("o-mode").value;
  $("o-twap-opts").style.display = m === "twap" ? "block" : "none";
  $("o-limit-opts").style.display = (m === "limit" || m === "sell") ? "block" : "none";
  $("o-price").placeholder = m === "sell" ? "puste = market" : "np. 0.004";
  $("o-budget").placeholder = m === "sell" ? "ilość w coinach, np. 100000" : "np. 500";
});
$("o-create").addEventListener("click", async () => {
  const budget = parseFloat($("o-budget").value);
  if (!Number.isFinite(budget) || budget <= 0) { $("o-msg").textContent = "Podaj kwotę."; return; }
  const mode = $("o-mode").value;
  const px = parseFloat($("o-price").value);
  if (mode === "limit" && !(px > 0)) { $("o-msg").textContent = "Podaj cenę limit."; return; }
  try {
    const o = await createOrder(state.symbol, mode, budget,
      parseFloat($("o-hours").value) || 12, parseInt($("o-slices").value) || 8,
      (mode === "limit" || (mode === "sell" && px > 0)) ? px : null);
    $("o-msg").textContent = `Zlecenie #${o.id} utworzone jako szkic — potwierdź w Telegramie (przyjdzie prośba do 2 min).`;
    renderOrders();
  } catch (e) {
    $("o-msg").textContent = `Błąd: ${e.message}`;
  }
});

$("btn-news").addEventListener("click", async () => {
  openModal("Newsy", `<div class="muted">ładowanie…</div>`);
  const news = await fetchNews();
  const rows = news.map((n) => `
    <div style="padding:6px 0;border-bottom:1px solid #2a2e3955">
      <a href="${n.url}" target="_blank" style="color:#d1d4dc;text-decoration:none" title="${n.title}">${n.title_pl || n.title}</a>
      <div class="muted" style="font-size:11px">${n.source} • ${n.published_at ? plDate(n.published_at) : ""}</div>
    </div>`).join("");
  openModal(`Newsy (${news.length})`,
    (rows || `<div class="muted">Brak newsów — pierwszy zaciąg za chwilę (cron co 30 min).</div>`) +
    `<p class="muted" style="margin-top:8px">Źródła: Cointelegraph, CoinDesk (po angielsku — polskie tłumaczenia w planach). Klik otwiera artykuł.</p>`);
});

$("btn-info").addEventListener("click", async () => {
  const sym = state.symbol;
  openModal(`Info: ${sym.toUpperCase().replace(/USDT$/, "")}`, `<div class="muted">pytam CoinGecko…</div>`);
  const d = await fetchCoinDescription(sym);
  if (!d) { openModal("Info", `<div class="muted">Brak danych w CoinGecko dla tego coina.</div>`); return; }
  openModal(`${d.name} (${d.symbol})`,
    `<div style="line-height:1.6">
      ${d.rank ? `<div><span class="muted">Ranking kapitalizacji:</span> <b>#${d.rank}</b></div>` : ""}
      ${d.mcap ? `<div><span class="muted">Kapitalizacja:</span> <b>${Math.round(d.mcap).toLocaleString("pl-PL")} $</b></div>` : ""}
      ${d.categories.length ? `<div><span class="muted">Kategorie:</span> ${d.categories.join(", ")}</div>` : ""}
      ${d.home ? `<div><span class="muted">Strona:</span> <a href="${d.home}" target="_blank" style="color:#2962ff">${d.home}</a></div>` : ""}
      <p style="margin-top:10px;white-space:pre-wrap">${d.desc ? d.desc.slice(0, 2000) : "Brak opisu."}</p>
      ${d.desc && !d.isPl ? `<p class="muted">(opis po angielsku — CoinGecko nie ma polskiej wersji dla tego coina)</p>` : ""}
    </div>`);
});

$("btn-delist").addEventListener("click", async () => {
  openModal("Delistingi", `<div class="muted">ładowanie…</div>`);
  const anns = await fetchDelistingsAll();
  const rows = anns.map((a) => {
    const hits = (a.symbol_hits || []).map((h) =>
      `<span data-goto="${h}" style="cursor:pointer;color:#2962ff;margin-right:6px">${h.toUpperCase().replace(/USDT$/, "")}</span>`).join("");
    return `<div style="padding:6px 0;border-bottom:1px solid #2a2e3955">
      <div><b style="color:#ff1744">[${a.source.toUpperCase()}]</b> <span class="muted">${plDate(a.published_at || a.seen_at)}</span></div>
      <div>${a.title}</div>
      <div>${hits || '<span class="muted">brak naszych par w tytule</span>'}</div>
    </div>`;
  }).join("");
  openModal(`Delistingi (${anns.length})`,
    rows + `<p class="muted" style="margin-top:8px">Klik w nazwę coina = jego wykres (znacznik DELIST widoczny na świecach dziennych). Źródła: Binance, OKX, Bybit, KuCoin, statusy HTX — kolejne giełdy dojdą.</p>`);
});

// --- mobile: szuflady (lista coinow / panel boczny) ---
const aside = document.querySelector("aside");
const right = $("right");
$("btn-coins").addEventListener("click", () => {
  right.classList.remove("open");
  aside.classList.toggle("open");
});
$("btn-panel").addEventListener("click", () => {
  aside.classList.remove("open");
  right.classList.toggle("open");
});
// wybor coina na telefonie zamyka szuflade
$("symbol-list").addEventListener("click", (e) => {
  if (e.target.closest(".sym-row") && !e.target.dataset.star) aside.classList.remove("open");
});
// klik w wykres chowa szuflady
$("main").addEventListener("click", () => {
  aside.classList.remove("open");
  right.classList.remove("open");
});

(async function init() {
  state.symbols = await fetchSymbols();
  state.fav = await fetchWatchlist();
  renderList();
  loadVolumes();                              // ceny + wolumen na liscie (bez blokowania startu)
  setInterval(loadVolumes, 5 * 60 * 1000);    // odswiezanie co 5 minut
  await loadSymbol(state.symbol);
})();

</script>
