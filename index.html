<style>
  :root {
    --bg: #131722; --panel: #1e222d; --border: #2a2e39; --text: #d1d4dc;
    --muted: #787b86; --green: #26a69a; --red: #ef5350; --accent: #2962ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; height: 100vh; overflow: hidden; }
  #layout { display: grid; grid-template-columns: 240px 1fr 300px; grid-template-rows: 44px 26px 1fr; height: 100vh; }
  header { grid-column: 1 / 4; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
  #info-bar { grid-column: 1 / 4; display: flex; align-items: center; gap: 18px; padding: 0 14px;
    background: var(--panel); border-bottom: 1px solid var(--border); color: var(--muted);
    font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
  #info-bar b { color: var(--text); font-weight: 600; }
  header .sym { font-size: 16px; font-weight: 600; }
  header .px { font-size: 16px; font-variant-numeric: tabular-nums; }
  header .chg.up { color: var(--green); } header .chg.down { color: var(--red); }
  .iv-btn, .tool-btn { background: none; border: 1px solid transparent; color: var(--muted); padding: 4px 9px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .iv-btn:hover, .tool-btn:hover { color: var(--text); }
  .iv-btn.active { background: var(--accent); color: #fff; }
  #live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #live-dot.on { background: var(--green); }
  aside { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  aside input { margin: 8px; padding: 6px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); }
  #symbol-list { overflow-y: auto; flex: 1; }
  .sym-row { display: flex; align-items: center; gap: 6px; padding: 5px 12px; cursor: pointer; }
  .sym-row:hover { background: #2a2e3966; }
  .sym-row.active { background: #2962ff22; }
  .sym-row .sym-meta { margin-left: auto; color: var(--muted); font-size: 11px;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sym-row .star { color: var(--muted); cursor: pointer; }
  .sym-row .star.fav { color: #f5c518; }
  #list-opts { display: flex; align-items: center; gap: 8px; padding: 2px 12px 6px; }
  #btn-sort { border: 1px solid var(--border); margin-left: auto; padding: 2px 8px; }
  #main { position: relative; }
  #chart { position: absolute; inset: 0; }
  #right { background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
  .panel h3 { font-size: 12px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; letter-spacing: .4px; }
  #book { font-variant-numeric: tabular-nums; font-size: 12px; }
  #book .row { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 1px 2px; position: relative; }
  #book .row .bar { position: absolute; right: 0; top: 0; bottom: 0; opacity: .12; }
  #book .ask .p { color: var(--red); } #book .bid .p { color: var(--green); }
  #book .spread { text-align: center; color: var(--muted); padding: 3px 0; border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border); }
  .calc label { display: block; color: var(--muted); margin-top: 6px; font-size: 11px; }
  .calc input, .calc select { width: 100%; padding: 5px 7px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); }
  .calc .out { margin-top: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-variant-numeric: tabular-nums; }
  .calc .out div { display: flex; justify-content: space-between; padding: 1px 0; }
  .calc .out .net { font-weight: 700; border-top: 1px solid var(--border); margin-top: 4px; padding-top: 4px; }
  .calc .warn { color: #f5c518; }
  #signals-panel .sig { padding: 3px 0; border-bottom: 1px solid #2a2e3955; font-size: 12px; }
  .muted { color: var(--muted); }
  .only-mobile { display: none; }

  #iv-mobile { display: none; }

    #iv-mobile button.active { background: var(--accent); color: #fff; }

    aside.open { transform: translateX(0); }
    #right { right: 0; transform: translateX(105%); overflow-y: auto; }
    #right.open { transform: translateX(0); }
    #main { grid-column: 1; grid-row: 3; }

<script type="module">

// Wskazniki wlasne (faza 2 startuje tutaj): baza wolumenu, Ichimoku, Fibo.

function rollMedianShift1(vals, window = 30, minPeriods = 20) {
  const out = new Array(vals.length).fill(NaN);
  for (let i = 0; i < vals.length; i++) {
    const w = vals.slice(Math.max(0, i - window), i).filter(Number.isFinite);
    if (w.length >= minPeriods) {
      w.sort((a, b) => a - b);
      const m = w.length >> 1;
      out[i] = w.length % 2 ? w[m] : (w[m - 1] + w[m]) / 2;
    }
  }
  return out;
}

const hh = (rows, i, n) => Math.max(...rows.slice(Math.max(0, i - n + 1), i + 1).map((r) => r.high));
const ll = (rows, i, n) => Math.min(...rows.slice(Math.max(0, i - n + 1), i + 1).map((r) => r.low));

function ichimoku(rows, tenkanN = 9, kijunN = 26, spanBN = 52) {
  const step = rows.length > 1 ? rows[rows.length - 1].time - rows[rows.length - 2].time : 86400;
  const tenkan = [], kijun = [], spanA = [], spanB = [], chikou = [];
  for (let i = 0; i < rows.length; i++) {
    const t = rows[i].time;
    if (i >= tenkanN - 1) tenkan.push({ time: t, value: (hh(rows, i, tenkanN) + ll(rows, i, tenkanN)) / 2 });
    if (i >= kijunN - 1) kijun.push({ time: t, value: (hh(rows, i, kijunN) + ll(rows, i, kijunN)) / 2 });
    if (i >= kijunN - 1) {
      const a = ((hh(rows, i, tenkanN) + ll(rows, i, tenkanN)) / 2 + (hh(rows, i, kijunN) + ll(rows, i, kijunN)) / 2) / 2;
      spanA.push({ time: t + kijunN * step, value: a });   // przesuniecie 26 w przod
    }
    if (i >= spanBN - 1) spanB.push({ time: t + kijunN * step, value: (hh(rows, i, spanBN) + ll(rows, i, spanBN)) / 2 });
    if (i >= kijunN) chikou.push({ time: rows[i - kijunN].time, value: rows[i].close }); // close przesuniety wstecz
  }
  return { tenkan, kijun, spanA, spanB, chikou };
}

function sma(rows, n) {
  const out = [];
  let sum = 0;
  for (let i = 0; i < rows.length; i++) {
    sum += rows[i].close;
    if (i >= n) sum -= rows[i - n].close;
    if (i >= n - 1) out.push({ time: rows[i].time, value: sum / n });
  }
  return out;
}

function ema(rows, n) {
  const out = [];
  const k = 2 / (n + 1);
  let prev = null;
  for (let i = 0; i < rows.length; i++) {
    prev = prev === null ? rows[i].close : rows[i].close * k + prev * (1 - k);
    if (i >= n - 1) out.push({ time: rows[i].time, value: prev });
  }
  return out;
}

// poziomy Fibo miedzy dwoma recznymi kotwicami (jak na TradingView)
function fiboBetween(p1, p2) {
  const hi = Math.max(p1, p2), lo = Math.min(p1, p2), span = hi - lo;
  return [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1].map((f) => ({
    label: `${(f * 100).toFixed(1)}%`, price: hi - span * f,
  }));
}

function fiboLevels(rows, lookback = 180) {
  // auto z wykrywaniem kierunku: jesli dolek byl PRZED szczytem (trend wzrostowy),
  // mierzymy zniesienia ruchu w gore (0% na szczycie); w przeciwnym razie odwrotnie
  const seg = rows.slice(-lookback);
  if (!seg.length) return [];
  let hi = -Infinity, lo = Infinity, hiI = 0, loI = 0;
  seg.forEach((r, i) => {
    if (r.high > hi) { hi = r.high; hiI = i; }
    if (r.low < lo) { lo = r.low; loI = i; }
  });
  const span = hi - lo;
  const uptrend = loI <= hiI;
  return [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1].map((f) => ({
    label: `${(f * 100).toFixed(1)}%`,
    price: uptrend ? hi - span * f : lo + span * f,
  }));
}


// Dostep do Supabase przez REST (klucz anon, RLS: tylko odczyt + watchlista).


const H = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };

async function rest(path) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: H });
  if (!r.ok) throw new Error(`REST ${r.status}: ${path}`);
  return r.json();
}

async function fetchSymbols() {
  return rest(`symbols?select=symbol,state&order=symbol.asc&limit=2000`);
}

async function fetchWatchlist() {
  const rows = await rest(`watchlist?select=symbol`);
  return new Set(rows.map((r) => r.symbol));
}

async function toggleWatch(symbol, isFav) {
  const opts = { headers: { ...H, "Content-Type": "application/json", Prefer: "return=minimal" } };
  if (isFav) {
    await fetch(`${SUPABASE_URL}/rest/v1/watchlist?symbol=eq.${symbol}`, { ...opts, method: "DELETE" });
  } else {
    await fetch(`${SUPABASE_URL}/rest/v1/watchlist`, { ...opts, method: "POST", body: JSON.stringify({ symbol }) });
  }
}

async function fetchCandles(symbol, interval, want = 1500) {
  const rows = [];
  for (let off = 0; off < want; off += 1000) {
    const page = await rest(
      `candles?symbol=eq.${symbol}&interval=eq.${interval}` +
      `&select=ts,open,high,low,close,vol,count&order=ts.desc&limit=${Math.min(1000, want - off)}&offset=${off}`);
    rows.push(...page);
    if (page.length < 1000) break;
  }
  rows.reverse();
  return rows.map((r) => ({
    time: Math.floor(Date.parse(r.ts) / 1000),
    open: +r.open, high: +r.high, low: +r.low, close: +r.close,
    vol: +r.vol, count: +r.count,
  }));
}

async function fetchSignals(symbol) {
  return rest(`signals?symbol=eq.${symbol}&select=ts,kind,strength,detail&order=ts.asc&limit=1000`);
}

// cena z momentu sygnalu wyciagana z detail (jsonb) - bywa obiektem albo
// JSON-em zapisanym jako tekst (starsze wiersze). Brak ceny => null (nie zgadujemy).
function signalPrice(detail) {
  let d = detail;
  if (typeof d === "string") { try { d = JSON.parse(d); } catch (_e) { return null; } }
  if (!d || typeof d !== "object") return null;
  // "price_sent" = cena w chwili WYSYLKI alertu (to ja widzisz na Telegramie i o niej
  // myslimy jako o cenie wejscia); dopiero potem cena swiecy sygnalu i awaryjnie reszta
  for (const k of ["price_sent", "price", "close", "px", "low", "prev_close"]) {
    const v = Number(d[k]);
    if (Number.isFinite(v) && v > 0) return v;
  }
  return null;
}

// sygnaly LIVE (od startu systemu 2026-08-11) + wyniki z trackera
async function fetchLiveSignals() {
  const sigs = await rest(
    `signals?ts=gte.2026-08-11T00:00:00Z&kind=not.in.(awake,grupa_a)` +
    `&select=id,ts,symbol,kind,strength,detail&order=ts.desc&limit=500`);
  if (!sigs.length) return [];
  const ids = sigs.map((s) => s.id).join(",");
  const rev = await rest(`signal_review?signal_id=in.(${ids})&select=signal_id,ret_now_pct,mfe_pct,mae_pct,outcome`);
  const byId = new Map(rev.map((r) => [r.signal_id, r]));
  return sigs.map((s) => ({ ...s, review: byId.get(s.id) || null }));
}

async function fetchDailyVolumes() {
  try {
    const r = await fetch("https://api.huobi.pro/market/tickers");
    const d = await r.json();
    if (d.status === "ok" && Array.isArray(d.data)) {
      const out = new Map();
      for (const t of d.data) {
        if (!String(t.symbol).endsWith("usdt")) continue;
        out.set(t.symbol, { vol: +t.vol, close: +t.close });   // vol = obrot 24h w USDT
      }
      if (out.size) return out;
    }
  } catch (_e) { /* brak dostepu do HTX - schodzimy do swiec z bazy */ }
  const since = new Date(Date.now() - 2 * 86400 * 1000).toISOString();
  const rows = [];
  for (let off = 0; off < 6000; off += 1000) {
    const page = await rest(
      `candles?interval=eq.1day&ts=gte.${since}` +
      `&select=symbol,ts,vol,close&order=ts.desc&limit=1000&offset=${off}`);
    rows.push(...page);
    if (page.length < 1000) break;
  }
  const out = new Map();
  for (const r of rows) if (!out.has(r.symbol)) out.set(r.symbol, { vol: +r.vol, close: +r.close });
  return out;
}

// data po polsku, w dobie HTX (UTC+8)
function plDate(ts, withYear = true) {
  const d = new Date(Date.parse(ts) + 8 * 3600 * 1000);
  const dd = String(d.getUTCDate()).padStart(2, "0"), mm = String(d.getUTCMonth() + 1).padStart(2, "0");
  return withYear ? `${dd}.${mm}.${d.getUTCFullYear()}` : `${dd}.${mm}`;
}

// pasek info: wolumen 24h + baza 30d (nasze dane) + kapitalizacja (CoinGecko, cache)
const mcapCache = new Map();
async function fetchCoinInfo(symbol) {
  // wolumen 24h KROCZACY (jak ticker HTX): suma ostatnich 24 swiec godzinowych;
  // na zywo nadpisuje go subskrypcja market.detail z websocketu
  const h1 = await rest(`candles?symbol=eq.${symbol}&interval=eq.60min&select=vol&order=ts.desc&limit=24`);
  const vol24 = h1.length ? h1.reduce((a, r) => a + +r.vol, 0) : null;
  const rows = await rest(`candles?symbol=eq.${symbol}&interval=eq.1day&select=ts,vol&order=ts.desc&limit=31`);
  const hist = rows.slice(1).map((r) => +r.vol).sort((a, b) => a - b);
  const base = hist.length >= 20
    ? (hist.length % 2 ? hist[hist.length >> 1] : (hist[(hist.length >> 1) - 1] + hist[hist.length >> 1]) / 2)
    : null;
  const baseSym = symbol.replace(/usdt$/, "");
  let mcap = mcapCache.get(baseSym);
  if (mcap === undefined) {
    mcap = null;
    try {
      const s = await (await fetch(`https://api.coingecko.com/api/v3/search?query=${baseSym}`)).json();
      const coin = (s.coins || []).find((c) => String(c.symbol).toLowerCase() === baseSym);
      if (coin) {
        const m = await (await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${coin.id}`)).json();
        mcap = m?.[0]?.market_cap ?? null;
      }
    } catch (_e) { /* limit CoinGecko - trudno */ }
    mcapCache.set(baseSym, mcap);
  }
  return { vol24, base, mcap };
}

// Websocket HTX (publiczny): swiece tick-po-ticku + arkusz bid/ask.
// Ramki sa gzipowane -> pako.inflate; ping/pong utrzymuje polaczenie.
const WS_URL = "wss://api.huobi.pro/ws";

class HtxFeed {
  constructor({ onKline, onDepth, onDetail, onStatus }) {
    this.onKline = onKline; this.onDepth = onDepth;
    this.onDetail = onDetail || (() => {});
    this.onStatus = onStatus || (() => {});
    this.ws = null; this.subs = []; this.alive = false;
    this._connect();
  }

  _connect() {
    this.ws = new WebSocket(WS_URL);
    this.ws.binaryType = "arraybuffer";
    this.ws.onopen = () => { this.alive = true; this.onStatus(true); this.subs.forEach((s) => this._send({ sub: s })); };
    this.ws.onclose = () => { this.alive = false; this.onStatus(false); setTimeout(() => this._connect(), 2000); };
    this.ws.onerror = () => this.ws.close();
    this.ws.onmessage = (e) => {
      const m = JSON.parse(pako.inflate(new Uint8Array(e.data), { to: "string" }));
      if (m.ping) { this._send({ pong: m.ping }); return; }
      if (!m.ch || !m.tick) return;
      if (m.ch.includes(".kline.")) this.onKline(m.ch, m.tick);
      else if (m.ch.includes(".depth.")) this.onDepth(m.ch, m.tick);
      else if (m.ch.endsWith(".detail")) this.onDetail(m.ch, m.tick);
    };
  }

  _send(obj) { if (this.ws?.readyState === 1) this.ws.send(JSON.stringify(obj)); }

  // przelacza subskrypcje na nowy symbol/interwal (unsub starych)
  watch(symbol, htxPeriod) {
    for (const s of this.subs) this._send({ unsub: s });
    this.subs = [`market.${symbol}.kline.${htxPeriod}`, `market.${symbol}.depth.step0`,
                 `market.${symbol}.detail`];
    if (this.alive) this.subs.forEach((s) => this._send({ sub: s }));
  }
}

// Wypelniona chmura Ichimoku
class CloudPrimitive {
  constructor(chart, series, getSpans) { this._c = chart; this._s = series; this._get = getSpans; }
  updateAllViews() {}
  paneViews() {
    return [{
      renderer: () => ({
        draw: (target) => target.useMediaCoordinateSpace(({ context: ctx }) => {
          const { spanA, spanB } = this._get() || {};
          if (!spanA?.length || !spanB?.length) return;
          const byTime = new Map(spanB.map((p) => [p.time, p.value]));
          const pts = [];
          for (const p of spanA) {
            const b = byTime.get(p.time);
            if (b === undefined) continue;
            const x = this._c.timeScale().timeToCoordinate(p.time);
            const ya = this._s.priceToCoordinate(p.value);
            const yb = this._s.priceToCoordinate(b);
            if (x === null || ya === null || yb === null) continue;
            pts.push({ x, ya, yb, up: p.value >= b });
          }
          let seg = [];
          const flush = () => {
            if (seg.length < 2) { seg = []; return; }
            ctx.beginPath();
            ctx.moveTo(seg[0].x, seg[0].ya);
            for (const q of seg) ctx.lineTo(q.x, q.ya);
            for (let i = seg.length - 1; i >= 0; i--) ctx.lineTo(seg[i].x, seg[i].yb);
            ctx.closePath();
            ctx.fillStyle = seg[0].up ? "rgba(38,166,154,0.16)" : "rgba(239,83,80,0.16)";
            ctx.fill();
            seg = [];
          };
          for (const q of pts) {
            if (seg.length && seg[seg.length - 1].up !== q.up) { seg.push(q); flush(); seg = [q]; }
            else seg.push(q);
          }
          flush();
        }),
      }),
    }];
  }
}

// Kropki cenowe sygnalow: mala wypelniona kropka dokladnie na (time, price)
// z chwili sygnalu - uzupelnia marker przy swiecy (ten pokazuje tylko dzien).
class SignalDotsPrimitive {
  constructor(chart, series, getDots) { this._c = chart; this._s = series; this._get = getDots; }
  updateAllViews() {}
  paneViews() {
    return [{
      renderer: () => ({
        draw: (target) => target.useMediaCoordinateSpace(({ context: ctx }) => {
          const dots = this._get() || [];
          if (!dots.length) return;
          const ts = this._c.timeScale();
          for (const d of dots) {
            const x = ts.timeToCoordinate(d.time);
            const y = this._s.priceToCoordinate(d.price);
            if (x === null || y === null) continue;
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fillStyle = d.color;
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = "rgba(0,0,0,0.85)";  // ciemny obrys - widoczna na obu motywach
            ctx.stroke();
          }
        }),
      }),
    }];
  }
}

// Narzedzia: miarka % / Fibo 2pkt - rysowane na kanwie, podglad za kursorem
class ToolPrimitive {
  constructor(chart, series, dataRef) {
    this._c = chart; this._s = series; this._data = dataRef;
    this.mode = null;    // 'ruler' | 'fibo2'
    this.p1 = null; this.p2 = null; this.preview = null;
    this._ru = null;
  }
  attached(param) { this._ru = param.requestUpdate; }
  refresh() { if (this._ru) this._ru(); }
  updateAllViews() {}
  paneViews() {
    return [{
      renderer: () => ({
        draw: (target) => target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
          const a = this.p1, b = this.p2 ?? this.preview;
          if (!a || !b) return;
          if (!this.mode && !this.p2) return;   // rysuj w trakcie LUB gdy skonczone
          this._lastMode = this.mode ?? this._lastMode;
          const ts = this._c.timeScale();
          const x1 = ts.timeToCoordinate(a.time), y1 = this._s.priceToCoordinate(a.price);
          const x2 = ts.timeToCoordinate(b.time), y2 = this._s.priceToCoordinate(b.price);
          if ([x1, y1, x2, y2].some((v) => v === null)) return;
          if ((this.mode ?? this._lastMode) === "ruler") this._ruler(ctx, x1, y1, x2, y2, a, b);
          else this._fibo(ctx, x1, x2, a, b, mediaSize);
        }),
      }),
    }];
  }
  _ruler(ctx, x1, y1, x2, y2, a, b) {
    const up = b.price >= a.price;
    const col = up ? "38,166,154" : "239,83,80";
    ctx.fillStyle = `rgba(${col},0.13)`;
    ctx.fillRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1) || 2, Math.abs(y2 - y1) || 2);
    ctx.strokeStyle = `rgb(${col})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const chg = (b.price / a.price - 1) * 100;
    const data = this._data();
    const i1 = data.findIndex((r) => r.time === a.time), i2 = data.findIndex((r) => r.time === b.time);
    const bars = i1 >= 0 && i2 >= 0 ? Math.abs(i2 - i1) : "?";
    const lines = [`${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%`, `${fp(a.price)} → ${fp(b.price)}`, `słupki: ${bars}`];
    ctx.font = "12px Segoe UI";
    const w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 16;
    const bx = Math.min(Math.max(4, x2 + 10), (ctx.canvas?.width ?? 9999) - w - 4);
    const by = Math.max(4, y2 - 52);
    ctx.fillStyle = `rgba(${col},0.95)`;
    ctx.beginPath(); ctx.roundRect(bx, by, w, 50, 6); ctx.fill();
    ctx.fillStyle = "#fff";
    lines.forEach((l, i) => ctx.fillText(l, bx + 8, by + 15 + i * 15));
  }
  _fibo(ctx, x1, x2, a, b, mediaSize) {
    const xa = Math.min(x1, x2), xb = Math.max(x1, x2);
    ctx.font = "11px Segoe UI";
    for (const lv of fiboBetween(a.price, b.price)) {
      const y = this._s.priceToCoordinate(lv.price);
      if (y === null) continue;
      ctx.strokeStyle = "rgba(245,197,24,0.75)";
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(xa, y); ctx.lineTo(xb, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#f5c518";
      ctx.fillText(`${lv.label}  ${fp(lv.price)}`, Math.min(xb + 6, (mediaSize?.width ?? 9999) - 90), y + 4);
    }
  }
}

class ChmuraChart {
  constructor(el) {
    this.el = el;
    this.chart = LightweightCharts.createChart(el, {
      layout: { background: { color: "#131722" }, textColor: "#d1d4dc" },
      grid: { vertLines: { color: "#1e222d" }, horzLines: { color: "#1e222d" } },
      crosshair: { mode: 0 },
      timeScale: { timeVisible: true, borderColor: "#2a2e39" },
      rightPriceScale: { borderColor: "#2a2e39" },
      autoSize: true,
    });
    this.candles = this.chart.addCandlestickSeries({
      upColor: "#26a69a", downColor: "#ef5350", wickUpColor: "#26a69a",
      wickDownColor: "#ef5350", borderVisible: false,
      priceFormat: { type: "price", precision: 8, minMove: 1e-8 },
    });
    this.volume = this.chart.addHistogramSeries({
      priceScaleId: "vol", priceFormat: { type: "volume" }, color: "#26a69a55",
    });
    this.baseline = this.chart.addLineSeries({
      priceScaleId: "vol", color: "#f5c518", lineWidth: 1,
      priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
    });
    this.chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.78, bottom: 0 } });
    this.ichSeries = []; this.fibSeries = [];
    this.maSeries = {}; this.data = [];
    this._spans = null; this._cloud = null;

    this.tool = new ToolPrimitive(this.chart, this.candles, () => this.data);
    this.candles.attachPrimitive(this.tool);
    this._sigDots = [];
    this._dotsPrim = new SignalDotsPrimitive(this.chart, this.candles, () => this._sigDots);
    this.candles.attachPrimitive(this._dotsPrim);
    // narzedzia rysowane PRZECIAGNIECIEM (palcem/myszka), jak na TradingView
    this._dragging = false;
    this._capturedId = null;
    el.addEventListener("pointerdown", (e) => {
      if (!this.tool.mode || this._dragging) return;      // drugi palec nie psuje rysowania
      if (e.button != null && e.button !== 0) return;     // tylko lewy przycisk / palec
      e.preventDefault();
      const tp = this._toTimePrice(e);
      if (!tp) return;
      this._dragging = true;
      this._setPan(false);                                // pan na pewno wylaczony w trakcie
      // capture: pointerup/move trafiaja do nas nawet gdy palec zjedzie z wykresu
      try { el.setPointerCapture(e.pointerId); this._capturedId = e.pointerId; }
      catch (_e) { this._capturedId = null; }
      this.tool.p1 = tp; this.tool.p2 = null; this.tool.preview = tp;
      this.tool.refresh();                                // podglad widoczny od razu
    }, { passive: false });
    el.addEventListener("pointermove", (e) => {
      if (!this._dragging) return;
      if (this._capturedId != null && e.pointerId !== this._capturedId) return;
      e.preventDefault();
      const tp = this._toTimePrice(e);
      if (tp) { this.tool.preview = tp; this.tool.refresh(); }
    }, { passive: false });
    const finish = (e) => {
      if (!this._dragging) return;
      if (this._capturedId != null && e.pointerId !== this._capturedId) return;
      this._dragging = false;
      this._releaseCapture();
      const tp = this._toTimePrice(e) ?? this.tool.preview;
      this.tool.p2 = tp;
      this.tool.mode = null;          // rysunek zostaje, wykres znow reaguje na pan/zoom
      this._setPan(true);
      this.el.style.cursor = "default";
      this.tool.refresh();
    };
    el.addEventListener("pointerup", finish, { passive: false });
    el.addEventListener("pointercancel", finish, { passive: false });
  }

  _releaseCapture() {
    if (this._capturedId == null) return;
    try { this.el.releasePointerCapture(this._capturedId); } catch (_e) { /* juz zwolnione */ }
    this._capturedId = null;
  }

  _toTimePrice(e) {
    const rect = this.el.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const logical = this.chart.timeScale().coordinateToLogical(x);
    if (logical === null || !this.data.length) return null;
    const i = Math.max(0, Math.min(this.data.length - 1, Math.round(logical)));
    const price = this.candles.coordinateToPrice(y);
    if (price === null) return null;
    return { time: this.data[i].time, price };
  }

  _setPan(on) {
    // pan/zoom nie moze sie wlaczyc w POLOWIE przeciagania ani gdy narzedzie uzbrojone
    if (on && (this._dragging || this.tool?.mode)) return;
    this.chart.applyOptions({ handleScroll: on, handleScale: on });
    this.el.style.touchAction = on ? "auto" : "none";
  }

  setData(rows) {
    this.data = rows;
    this.candles.setData(rows);
    this.volume.setData(rows.map((r) => ({
      time: r.time, value: r.vol, color: r.close >= r.open ? "#26a69a55" : "#ef535055",
    })));
    const med = rollMedianShift1(rows.map((r) => r.vol), 30, 20);
    this.baseline.setData(rows.map((r, i) => ({ time: r.time, value: med[i] }))
      .filter((p) => Number.isFinite(p.value)));
    for (const key of Object.keys(this.maSeries)) this._refreshMA(key);
    if (this.ichSeries.length) { this.toggleIchimoku(); this.toggleIchimoku(); }
    this.clearTool();
    this.chart.timeScale().fitContent();
  }

  updateLast(t) {
    const last = this.data[this.data.length - 1];
    const row = { time: t.id, open: t.open, high: t.high, low: t.low, close: t.close, vol: t.vol, count: t.count };
    if (last && t.id < last.time) return;
    if (last && t.id === last.time) this.data[this.data.length - 1] = row;
    else this.data.push(row);
    this.candles.update({ time: row.time, open: row.open, high: row.high, low: row.low, close: row.close });
    this.volume.update({ time: row.time, value: row.vol, color: row.close >= row.open ? "#26a69a55" : "#ef535055" });
  }

  // znaczniki na KAZDYM interwale: sygnal (doba HTX) przyciagany do pierwszej
  // swiecy danego dnia, delisting do najblizszej swiecy
  setMarkersAll(signals, delistings) {
    if (!this.data.length) { this.candles.setMarkers([]); this._sigDots = []; return; }
    const times = this.data.map((r) => r.time);
    const snap = (t) => {
      let lo = 0, hi = times.length - 1, ans = null;
      while (lo <= hi) {
        const m = (lo + hi) >> 1;
        if (times[m] >= t) { ans = times[m]; hi = m - 1; } else lo = m + 1;
      }
      if (ans !== null && ans - t < 86400) return ans;          // pierwsza swieca doby
      return times[times.length - 1] >= t - 86400 ? null : null;
    };
    const marks = [];
    const dots = [];
    for (const s of signals) {
      const mk = KIND_MARK[s.kind];
      if (!mk) continue;
      const t = snap(Math.floor(Date.parse(s.ts) / 1000));
      if (t === null) continue;
      marks.push({ time: t, position: mk.shape === "arrowDown" ? "aboveBar" : "belowBar",
                   color: mk.color, shape: mk.shape, text: mk.text });
      // kropka DOKLADNIE na cenie sygnalu - tylko gdy detail ma cene
      const px = signalPrice(s.detail);
      if (px != null) dots.push({ time: t, price: px, color: mk.color });
    }
    this._sigDots = dots;
    for (const d of delistings || []) {
      const t = snap(Math.floor(Date.parse(d.published_at || d.seen_at) / 1000));
      if (t !== null) marks.push({ time: t, position: "aboveBar", color: "#ff1744",
                                   shape: "square", text: `DELIST:${(d.source || "").toUpperCase()}` });
    }
    marks.sort((a, b) => a.time - b.time);
    this.candles.setMarkers(marks);
  }

  toggleMA(key) {
    if (this.maSeries[key]) {
      this.chart.removeSeries(this.maSeries[key]); delete this.maSeries[key]; return false;
    }
    this.maSeries[key] = this.chart.addLineSeries({
      color: MA_DEFS[key].color, lineWidth: 1, priceLineVisible: false,
      lastValueVisible: false, crosshairMarkerVisible: false, title: key,
    });
    this._refreshMA(key);
    return true;
  }
  _refreshMA(key) { this.maSeries[key].setData(MA_DEFS[key].fn(this.data, MA_DEFS[key].n)); }

  toggleIchimoku() {
    if (this.ichSeries.length) {
      if (this._cloud) { this.candles.detachPrimitive(this._cloud); this._cloud = null; }
      this.ichSeries.forEach((s) => this.chart.removeSeries(s)); this.ichSeries = [];
      this._spans = null;
      return false;
    }
    const ich = ichimoku(this.data);
    this._spans = { spanA: ich.spanA, spanB: ich.spanB };
    const mk = (color, data) => {
      const s = this.chart.addLineSeries({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
      s.setData(data); this.ichSeries.push(s);
    };
    mk("#2962ff", ich.tenkan); mk("#b71c1c", ich.kijun);
    mk("#26a69a88", ich.spanA); mk("#ef535088", ich.spanB); mk("#78909c", ich.chikou);
    this._cloud = new CloudPrimitive(this.chart, this.candles, () => this._spans);
    this.candles.attachPrimitive(this._cloud);
    return true;
  }

  toggleFibo() {
    if (this.fibSeries.length) {
      this.fibSeries.forEach((s) => this.chart.removeSeries(s)); this.fibSeries = []; return false;
    }
    const t0 = this.data[Math.max(0, this.data.length - 180)]?.time, t1 = this.data[this.data.length - 1]?.time;
    for (const lv of fiboLevels(this.data, 180)) {
      const s = this.chart.addLineSeries({ color: "#f5c51888", lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: true, title: `Fibo ${lv.label}`, crosshairMarkerVisible: false });
      s.setData([{ time: t0, value: lv.price }, { time: t1, value: lv.price }]);
      this.fibSeries.push(s);
    }
    return true;
  }

  // --- narzedzia (przeciaganie) ---
  armTool(mode) {
    if (this.tool.mode === mode && !this.tool.p2) { this.clearTool(); return; } // drugi klik = wylacz
    this.clearTool();
    this.tool.mode = mode;
    this._setPan(false);                 // na czas rysowania wykres nie panuje
    this.el.style.cursor = "crosshair";
  }
  clearTool() {
    this.tool.mode = null; this.tool.p1 = null; this.tool.p2 = null; this.tool.preview = null;
    this._dragging = false;
    this._releaseCapture();
    this._setPan(true);
    this.tool.refresh();
    this.el.style.cursor = "default";
  }
}


// Arkusz bid/ask + kalkulator plynnosci (market-impact) i prowizji.
const fmtP = (p) => (p >= 1 ? p.toFixed(4) : p.toPrecision(5));
const fmtN = (v) => Math.round(v).toLocaleString("pl-PL");

class OrderBook {
  constructor(bookEl, calcEls) {
    this.el = bookEl; this.c = calcEls;
    this.bids = []; this.asks = [];
    ["qty", "entry", "fee", "conv", "side"].forEach((k) =>
      this.c[k].addEventListener("input", () => this.recalc()));
    this.c.mode.addEventListener("change", () => this.recalc());
  }

  update(tick) {
    this.bids = (tick.bids || []).map(([p, q]) => [+p, +q]);
    this.asks = (tick.asks || []).map(([p, q]) => [+p, +q]);
    this.render();
    this.recalc();
  }

  render(depth = 12) {
    if (!this.bids.length) { this.el.textContent = "brak danych arkusza"; return; }
    const maxQ = Math.max(...this.asks.slice(0, depth).map(([, q]) => q),
                          ...this.bids.slice(0, depth).map(([, q]) => q));
    const row = (p, q, cls) => `
      <div class="row ${cls}">
        <span class="p">${fmtP(p)}</span><span>${fmtN(q)}</span><span>${fmtN(p * q)} $</span>
        <span class="bar" style="width:${(q / maxQ) * 100}%;background:${cls === "ask" ? "#ef5350" : "#26a69a"}"></span>
      </div>`;
    const spread = this.asks[0][0] - this.bids[0][0];
    const spreadPct = (spread / this.asks[0][0]) * 100;
    this.el.innerHTML =
      [...this.asks.slice(0, depth)].reverse().map(([p, q]) => row(p, q, "ask")).join("") +
      `<div class="spread">spread ${fmtP(spread)} (${spreadPct.toFixed(2)}%)</div>` +
      this.bids.slice(0, depth).map(([p, q]) => row(p, q, "bid")).join("");
  }

  // zejscie po arkuszu: ile dostane / zaplace i do jakiej ceny zejde
  walk(levels, qty) {
    let remaining = qty, quote = 0, worst = null;
    for (const [p, q] of levels) {
      const take = Math.min(remaining, q);
      quote += take * p; remaining -= take; worst = p;
      if (remaining <= 0) break;
    }
    return { filledQty: qty - remaining, quote, worst, unfilled: remaining };
  }

  // zejscie po arkuszu az do uzbierania docelowej KWOTY w USD
  walkQuote(levels, targetQuote) {
    let remainingQ = targetQuote, qty = 0, quote = 0, worst = null;
    for (const [p, q] of levels) {
      const lvlQuote = p * q;
      const takeQ = Math.min(remainingQ, lvlQuote);
      qty += takeQ / p; quote += takeQ; remainingQ -= takeQ; worst = p;
      if (remainingQ <= 0) break;
    }
    return { filledQty: qty, quote, worst, unfilledQuote: remainingQ };
  }

  recalc() {
    const out = this.c.out;
    const amount = parseFloat(this.c.qty.value);
    if (!Number.isFinite(amount) || amount <= 0 || !this.bids.length) {
      out.innerHTML = `<div class="muted">Podaj kwotę — liczę po żywym arkuszu.</div>`; return;
    }
    const inCoins = this.c.mode.checked;
    const side = this.c.side.value;
    const feePct = (parseFloat(this.c.fee.value) || 0) / 100;
    const convPct = (parseFloat(this.c.conv.value) || 0) / 100;
    const entry = parseFloat(this.c.entry.value);
    const best = side === "sell" ? this.bids[0][0] : this.asks[0][0];
    const levels = side === "sell" ? this.bids : this.asks;
    let w, qty;
    if (inCoins) {
      qty = amount;
      w = this.walk(levels, qty);
    } else {
      const wq = this.walkQuote(levels, amount);
      qty = wq.filledQty;
      w = { filledQty: wq.filledQty, quote: wq.quote, worst: wq.worst,
            unfilled: wq.unfilledQuote > 0 ? wq.unfilledQuote / (wq.worst || best) : 0 };
    }
    const avg = w.quote / w.filledQty;
    const slip = Math.abs(avg / best - 1) * 100;
    const fee = w.quote * feePct;
    const conv = w.quote * convPct;
    const net = side === "sell" ? w.quote - fee - conv : -(w.quote + fee + conv);

    const L = [];
    L.push(`<div><span>Najlepsza cena</span><span>${fmtP(best)}</span></div>`);
    L.push(`<div><span>Zejdziesz do ceny</span><span><b>${fmtP(w.worst)}</b> (${(((w.worst / best) - 1) * 100).toFixed(2)}%)</span></div>`);
    L.push(`<div><span>Średnia wykonania</span><span>${fmtP(avg)} (poślizg ${slip.toFixed(2)}%)</span></div>`);
    L.push(`<div><span>Wartość ${side === "sell" ? "sprzedaży" : "zakupu"}</span><span>${fmtN(w.quote)} $</span></div>`);
    L.push(`<div><span>Prowizja transakcji (${(feePct * 100).toFixed(2)}%)</span><span>-${fmtN(fee)} $</span></div>`);
    if (convPct > 0) L.push(`<div><span>Przewalutowanie (${(convPct * 100).toFixed(2)}%)</span><span>-${fmtN(conv)} $</span></div>`);
    if (side === "sell") {
      L.push(`<div class="net"><span>NA RĘKĘ</span><span>${fmtN(net)} $</span></div>`);
      if (Number.isFinite(entry) && entry > 0) {
        const cost = qty * entry;
        const entryFee = cost * feePct;
        const pnl = net - cost - entryFee;
        L.push(`<div><span>Koszt wejścia (z prowizją)</span><span>${fmtN(cost + entryFee)} $</span></div>`);
        L.push(`<div class="net"><span>ZYSK/STRATA</span><span style="color:${pnl >= 0 ? "#26a69a" : "#ef5350"}">${pnl >= 0 ? "+" : ""}${fmtN(pnl)} $ (${((pnl / (cost + entryFee)) * 100).toFixed(1)}%)</span></div>`);
      }
    } else {
      L.push(`<div class="net"><span>ZAPŁACISZ ŁĄCZNIE</span><span>${fmtN(-net)} $</span></div>`);
    }
    if (w.unfilled > 0) {
      L.push(`<div class="warn"><span>UWAGA: arkusz za płytki</span><span>nie zmieści się ${fmtN(w.unfilled)} szt.</span></div>`);
    }
    out.innerHTML = L.join("");
  }
}

const fmtUsd = (v) => v == null ? "—" : Math.round(v).toLocaleString("pl-PL") + " $";

// wolumen krotko, po polsku: 217 tys. $ / 1,3 mln $ / 2,1 mld $
const fmtVolPl = (v) => {
  if (v == null || !Number.isFinite(v)) return "—";
  if (v >= 1e9) return (v / 1e9).toFixed(1).replace(".", ",") + " mld $";
  if (v >= 1e6) return (v / 1e6).toFixed(1).replace(".", ",") + " mln $";
  if (v >= 1e3) return Math.round(v / 1e3) + " tys. $";
  return Math.round(v) + " $";
};

  const os = await fetchOrders(state.symbol);
  $("o-list").innerHTML = os.length
    ? os.map((o) => `<div class="sig">#${o.id} ${o.mode} ${Math.round(o.done_usdt)}/${Math.round(o.budget_usdt)} $
        — <span class="${o.status === 'error' ? '' : 'muted'}">${ORDER_ST[o.status] ?? o.status}</span></div>`).join("")
    : "";
}
$("o-mode").addEventListener("change", () => {
  const m = $("o-mode").value;
  $("o-twap-opts").style.display = m === "twap" ? "block" : "none";
  $("o-limit-opts").style.display = (m === "limit" || m === "sell") ? "block" : "none";
  $("o-price").placeholder = m === "sell" ? "puste = market" : "np. 0.004";
  $("o-budget").placeholder = m === "sell" ? "ilość w coinach, np. 100000" : "np. 500";
});
$("o-create").addEventListener("click", async () => {
  const budget = parseFloat($("o-budget").value);
  if (!Number.isFinite(budget) || budget <= 0) { $("o-msg").textContent = "Podaj kwotę."; return; }
  const mode = $("o-mode").value;
  const px = parseFloat($("o-price").value);
  if (mode === "limit" && !(px > 0)) { $("o-msg").textContent = "Podaj cenę limit."; return; }
  try {
    const o = await createOrder(state.symbol, mode, budget,
      parseFloat($("o-hours").value) || 12, parseInt($("o-slices").value) || 8,
      (mode === "limit" || (mode === "sell" && px > 0)) ? px : null);
    $("o-msg").textContent = `Zlecenie #${o.id} utworzone jako szkic — potwierdź w Telegramie (przyjdzie prośba do 2 min).`;
    renderOrders();
  } catch (e) {
    $("o-msg").textContent = `Błąd: ${e.message}`;
  }
});

$("btn-news").addEventListener("click", async () => {
  openModal("Newsy", `<div class="muted">ładowanie…</div>`);
  const news = await fetchNews();
  const rows = news.map((n) => `
    <div style="padding:6px 0;border-bottom:1px solid #2a2e3955">
      <a href="${n.url}" target="_blank" style="color:#d1d4dc;text-decoration:none" title="${n.title}">${n.title_pl || n.title}</a>
      <div class="muted" style="font-size:11px">${n.source} • ${n.published_at ? plDate(n.published_at) : ""}</div>
    </div>`).join("");
  openModal(`Newsy (${news.length})`,
    (rows || `<div class="muted">Brak newsów — pierwszy zaciąg za chwilę (cron co 30 min).</div>`) +
    `<p class="muted" style="margin-top:8px">Źródła: Cointelegraph, CoinDesk (po angielsku — polskie tłumaczenia w planach). Klik otwiera artykuł.</p>`);
});

$("btn-info").addEventListener("click", async () => {
  const sym = state.symbol;
  openModal(`Info: ${sym.toUpperCase().replace(/USDT$/, "")}`, `<div class="muted">pytam CoinGecko…</div>`);
  const d = await fetchCoinDescription(sym);
  if (!d) { openModal("Info", `<div class="muted">Brak danych w CoinGecko dla tego coina.</div>`); return; }
  openModal(`${d.name} (${d.symbol})`,
    `<div style="line-height:1.6">
      ${d.rank ? `<div><span class="muted">Ranking kapitalizacji:</span> <b>#${d.rank}</b></div>` : ""}
      ${d.mcap ? `<div><span class="muted">Kapitalizacja:</span> <b>${Math.round(d.mcap).toLocaleString("pl-PL")} $</b></div>` : ""}
      ${d.categories.length ? `<div><span class="muted">Kategorie:</span> ${d.categories.join(", ")}</div>` : ""}
      ${d.home ? `<div><span class="muted">Strona:</span> <a href="${d.home}" target="_blank" style="color:#2962ff">${d.home}</a></div>` : ""}
      <p style="margin-top:10px;white-space:pre-wrap">${d.desc ? d.desc.slice(0, 2000) : "Brak opisu."}</p>
      ${d.desc && !d.isPl ? `<p class="muted">(opis po angielsku — CoinGecko nie ma polskiej wersji dla tego coina)</p>` : ""}
    </div>`);
});

$("btn-delist").addEventListener("click", async () => {
  openModal("Delistingi", `<div class="muted">ładowanie…</div>`);
  const anns = await fetchDelistingsAll();
  const rows = anns.map((a) => {
    const hits = (a.symbol_hits || []).map((h) =>
      `<span data-goto="${h}" style="cursor:pointer;color:#2962ff;margin-right:6px">${h.toUpperCase().replace(/USDT$/, "")}</span>`).join("");
    return `<div style="padding:6px 0;border-bottom:1px solid #2a2e3955">
      <div><b style="color:#ff1744">[${a.source.toUpperCase()}]</b> <span class="muted">${plDate(a.published_at || a.seen_at)}</span></div>
      <div>${a.title}</div>
      <div>${hits || '<span class="muted">brak naszych par w tytule</span>'}</div>
    </div>`;
  }).join("");
  openModal(`Delistingi (${anns.length})`,
    rows + `<p class="muted" style="margin-top:8px">Klik w nazwę coina = jego wykres (znacznik DELIST widoczny na świecach dziennych). Źródła: Binance, OKX, Bybit, KuCoin, statusy HTX — kolejne giełdy dojdą.</p>`);
});

// --- mobile: szuflady (lista coinow / panel boczny) ---
const aside = document.querySelector("aside");
const right = $("right");
$("btn-coins").addEventListener("click", () => {
  right.classList.remove("open");
  aside.classList.toggle("open");
});
$("btn-panel").addEventListener("click", () => {
  aside.classList.remove("open");
  right.classList.toggle("open");
});
// wybor coina na telefonie zamyka szuflade
$("symbol-list").addEventListener("click", (e) => {
  if (e.target.closest(".sym-row") && !e.target.dataset.star) aside.classList.remove("open");
});
// klik w wykres chowa szuflady
$("main").addEventListener("click", () => {
  aside.classList.remove("open");
  right.classList.remove("open");
});

(async function init() {
  state.symbols = await fetchSymbols();
  state.fav = await fetchWatchlist();
  renderList();
  loadVolumes();                              // ceny + wolumen na liscie (bez blokowania startu)
  setInterval(loadVolumes, 5 * 60 * 1000);    // odswiezanie co 5 minut
  await loadSymbol(state.symbol);
})();

</script>
